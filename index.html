<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Estado Inicial · Greenergy v5</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --g900:#062812; --g800:#0a3d1c; --g700:#0f5526; --g600:#156b30;
  --g500:#1a853b; --g400:#22a44a; --g300:#3dc463; --g200:#7ddd99;
  --g100:#bff0ce; --g50:#e8faf0;
  --n900:#0d0f0e; --n800:#1a1e1c; --n700:#2b312d; --n600:#414a44;
  --n500:#5c6860; --n400:#7e8e84; --n300:#a8b5ae; --n200:#cdd8d2;
  --n100:#e4ece8; --n50:#f2f7f4;
  --amber:#f59e0b; --red:#ef4444; --blue:#3b82f6; --purple:#8b5cf6;
  --r:10px; --r-sm:6px; --r-lg:16px; --r-xl:20px;
  --font:'Plus Jakarta Sans',sans-serif;
  --sh:0 2px 8px rgba(0,0,0,.08);
  --sh-lg:0 8px 24px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--font);background:var(--n50);color:var(--n900);font-size:15px;line-height:1.5;padding-bottom:72px}

/* ── HEADER ─────────────────────────────── */
.hdr{background:var(--g800);position:sticky;top:0;z-index:200;box-shadow:var(--sh-lg)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:36px;height:36px;background:var(--g400);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-mark svg{width:20px;height:20px;fill:var(--g900)}
.brand-name{font-size:14px;font-weight:700;color:white;letter-spacing:-.01em;line-height:1.2}
.brand-sub{font-size:11px;color:rgba(255,255,255,.5);font-weight:400}
.hdr-right{display:flex;align-items:center;gap:8px}
.conn-pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;transition:all .3s}
.conn-pill.online{background:rgba(61,196,99,.18);color:var(--g200)}
.conn-pill.offline{background:rgba(239,68,68,.15);color:#fca5a5}
.conn-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.conn-pill.online .conn-dot{background:var(--g300)}
.conn-pill.offline .conn-dot{background:#f87171}
.project-code{font-size:10px;font-weight:600;color:rgba(255,255,255,.4);font-family:monospace;letter-spacing:.05em}

/* ── PROGRESS ────────────────────────────── */
.prog-bar{height:3px;background:rgba(255,255,255,.1)}
.prog-fill{height:100%;background:var(--g300);transition:width .4s ease}
.prog-row{display:flex;justify-content:space-between;align-items:center;padding:5px 16px 8px;font-size:11px;color:rgba(255,255,255,.5)}
.prog-pct{font-weight:600;color:var(--g200)}

/* ── TABS ─────────────────────────────────── */
.tabs{display:flex;overflow-x:auto;background:var(--g900);padding:0 12px;gap:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;font-size:11px;font-weight:600;padding:9px 12px;color:rgba(255,255,255,.35);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;border-radius:4px 4px 0 0}
.tab:hover{color:rgba(255,255,255,.65)}
.tab.active{color:var(--g200);border-bottom-color:var(--g400);background:rgba(255,255,255,.05)}
.tab.done{color:rgba(255,255,255,.45)}
.tab.done::after{content:'✓';color:var(--g300);margin-left:4px;font-size:10px}

/* ── OFFLINE BANNER ──────────────────────── */
.offline-banner{background:#7f1d1d;color:#fecaca;font-size:12px;font-weight:500;text-align:center;padding:8px 16px;display:none}
.offline-banner.show{display:block}

/* ── MAIN ─────────────────────────────────── */
.main{max-width:680px;margin:0 auto}

/* ── SECTION HEADER ──────────────────────── */
.sec-hdr{background:white;border-bottom:1px solid var(--n100);padding:16px;display:flex;align-items:center;gap:12px}
.sec-icon{width:42px;height:42px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.sec-info h2{font-size:15px;font-weight:700;color:var(--n900)}
.sec-info p{font-size:12px;color:var(--n400);margin-top:2px}
.sec-counter{margin-left:auto;text-align:right;flex-shrink:0}
.sec-counter .num{font-size:22px;font-weight:700;color:var(--g500);line-height:1}
.sec-counter .lbl{font-size:10px;color:var(--n300);margin-top:2px}

/* ── ITEM CARD ────────────────────────────── */
.item{background:white;margin:8px 10px;border-radius:var(--r-lg);border:1.5px solid var(--n100);overflow:hidden;transition:all .2s}
.item.open{border-color:var(--g200);box-shadow:var(--sh)}
.item.crit{border-color:#fca5a5}
.item.done{border-color:var(--n100)}

.item-hd{display:flex;align-items:center;padding:13px 14px;cursor:pointer;gap:11px;user-select:none}
.status-ring{width:28px;height:28px;border-radius:50%;border:2px solid var(--n200);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:all .2s;font-weight:700}
.status-ring.good{background:var(--g500);border-color:var(--g500);color:white}
.status-ring.regular{background:var(--amber);border-color:var(--amber);color:white}
.status-ring.bad{background:var(--red);border-color:var(--red);color:white}
.status-ring.absent{background:var(--purple);border-color:var(--purple);color:white}

.item-txt{flex:1;min-width:0}
.item-name{font-size:13px;font-weight:600;color:var(--n900);line-height:1.3}
.item-ntc{font-size:10px;color:var(--n400);margin-top:3px;font-family:monospace}

.item-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
.ph-chip{font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;font-family:monospace}
.ph-chip.none{background:var(--n50);color:var(--n400)}
.ph-chip.part{background:#fef3c7;color:#92400e}
.ph-chip.full{background:var(--g50);color:var(--g700)}
.chev{font-size:11px;color:var(--n300);transition:transform .2s}
.item.open .chev{transform:rotate(180deg)}

/* ── ITEM BODY ────────────────────────────── */
.item-bd{display:none;border-top:1px solid var(--n50)}
.item.open .item-bd{display:block}

/* condition */
.cond-wrap{padding:14px 14px 0}
.micro-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--n400);margin-bottom:8px}
.cond-row{display:flex;gap:6px}
.cond-btn{flex:1;padding:9px 4px;border-radius:var(--r);border:1.5px solid var(--n100);background:var(--n50);font-size:12px;font-weight:600;color:var(--n500);cursor:pointer;text-align:center;transition:all .15s;font-family:var(--font)}
.cond-btn:active{transform:scale(.97)}
.cond-btn.g{background:var(--g50);border-color:var(--g300);color:var(--g700)}
.cond-btn.r{background:#fffbeb;border-color:#fcd34d;color:#92400e}
.cond-btn.b{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
.cond-btn.a{background:#faf5ff;border-color:#c4b5fd;color:#6b21a8}

/* fields */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px 14px}
.f{display:flex;flex-direction:column;gap:4px}
.f.wide{grid-column:1/-1}
.f label{font-size:11px;font-weight:600;color:var(--n500)}
.f input,.f textarea,.f select{background:var(--n50);border:1.5px solid var(--n100);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;color:var(--n900);font-family:var(--font);transition:all .2s;width:100%}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--g300);background:white;box-shadow:0 0 0 3px rgba(34,164,74,.08)}
.f textarea{min-height:58px;resize:vertical}
.f-alert{font-size:11px;color:#92400e;background:#fef3c7;border-radius:var(--r-sm);padding:6px 9px;display:none;margin-top:2px;font-weight:500}
.f-alert.on{display:block}

/* photos */
.photos{padding:0 14px 14px}
.ph-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ph-slot{display:flex;flex-direction:column;align-items:center;gap:5px}
.ph-box{width:78px;height:64px;border:1.5px dashed var(--n200);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--n50);transition:all .2s;position:relative;overflow:hidden}
.ph-box:active{transform:scale(.96)}
.ph-box:hover{border-color:var(--g300);background:var(--g50)}
.ph-box.shot{border-style:solid;border-color:var(--g300);background:var(--g50)}
.ph-box img{width:100%;height:100%;object-fit:cover;border-radius:calc(var(--r) - 2px)}
.ph-box .ph-ico{font-size:20px;color:var(--n300)}
.ph-box .ph-lbl{font-size:9px;color:var(--n400);margin-top:2px}
.ph-box.shot .ph-ico{font-size:16px;color:var(--g500)}
.ph-box.shot .ph-lbl{color:var(--g600);font-size:9px}
.ph-del{position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:white;cursor:pointer;z-index:2;line-height:1}
.ph-del:active{background:var(--red)}
.ph-name{font-size:10px;color:var(--n400);text-align:center;max-width:78px;line-height:1.3}
.ph-input{display:none}

/* cond notice */
.c-notice{margin:8px 10px 0;padding:9px 13px;background:#eff6ff;border-left:3px solid var(--blue);border-radius:0 var(--r) var(--r) 0;font-size:12px;color:#1e40af;font-weight:500}

/* nav buttons */
.sec-nav{display:flex;gap:8px;padding:10px 10px 4px}
.nav-btn{flex:1;padding:14px;border-radius:var(--r);font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:var(--font);transition:all .2s;letter-spacing:-.01em}
.nav-btn:active{transform:scale(.98)}
.nav-prev{background:var(--n100);color:var(--n700)}
.nav-prev:hover{background:var(--n200)}
.nav-next{background:var(--g600);color:white}
.nav-next:hover{background:var(--g700)}
.nav-btn:disabled{opacity:.35;pointer-events:none}

/* ── GENERAL SCREEN ──────────────────────── */
.gen{padding:12px 10px}
.g-card{background:white;border-radius:var(--r-lg);border:1.5px solid var(--n100);padding:16px;margin-bottom:10px}
.g-card h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--n400);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--n50)}
.g-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g-f{display:flex;flex-direction:column;gap:4px}
.g-f.wide{grid-column:1/-1}
.g-f label{font-size:11px;font-weight:600;color:var(--n500)}
.g-f input,.g-f select{background:var(--n50);border:1.5px solid var(--n100);border-radius:var(--r-sm);padding:9px 10px;font-size:13px;color:var(--n900);font-family:var(--font);transition:all .2s;width:100%}
.g-f input:focus,.g-f select:focus{outline:none;border-color:var(--g300);background:white;box-shadow:0 0 0 3px rgba(34,164,74,.08)}

.tog-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--n50)}
.tog-row:last-child{border-bottom:none;padding-bottom:0}
.tog-info h4{font-size:13px;font-weight:600;color:var(--n800)}
.tog-info p{font-size:11px;color:var(--n400);margin-top:1px}
.tog{position:relative;width:44px;height:25px;background:var(--n200);border-radius:999px;cursor:pointer;transition:all .2s;flex-shrink:0}
.tog.on{background:var(--g500)}
.tog::after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;background:white;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tog.on::after{transform:translateX(19px)}

/* ── SUMMARY SCREEN ──────────────────────── */
.sum{padding:12px 10px}
.s-card{background:white;border-radius:var(--r-lg);border:1.5px solid var(--n100);overflow:hidden;margin-bottom:10px}
.s-hdr{padding:13px 16px;background:var(--g800);color:white;font-size:13px;font-weight:700}
.s-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--n50);font-size:13px}
.s-row:last-child{border-bottom:none}
.s-lbl{color:var(--n600)}
.s-val{font-weight:700}
.s-val.ok{color:var(--g500)}
.s-val.warn{color:var(--amber)}
.s-val.bad{color:var(--red)}

.issues{padding:6px 16px 10px}
.issue{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--n50);font-size:12px}
.issue:last-child{border-bottom:none}
.i-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.i-name{color:var(--n800);font-weight:500}
.i-tag{font-size:10px;color:var(--n400);margin-top:1px}

.sign-card{background:white;border-radius:var(--r-lg);border:1.5px solid var(--n100);padding:16px;margin-bottom:10px}
.sign-card h3{font-size:13px;font-weight:700;color:var(--n800);margin-bottom:12px}
.sign-canvas{width:100%;height:110px;border:1.5px dashed var(--n200);border-radius:var(--r);background:var(--n50);touch-action:none;cursor:crosshair;display:block}
.sign-clear{font-size:11px;color:var(--n400);background:none;border:none;cursor:pointer;margin-top:7px;font-family:var(--font);font-weight:500}

.sync-card{background:var(--g50);border:1.5px solid var(--g100);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:10px;display:none}
.sync-card.show{display:block}
.sync-card p{font-size:12px;color:var(--g700);font-weight:500;margin-bottom:10px}
.sync-btn{width:100%;padding:13px;background:var(--g600);color:white;border:none;border-radius:var(--r);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .2s}
.sync-btn:hover{background:var(--g700)}

.submit-btn{width:100%;padding:15px;background:var(--g600);color:white;border:none;border-radius:var(--r-lg);font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .2s;letter-spacing:-.01em}
.submit-btn:hover{background:var(--g700)}
.submit-btn:disabled{background:var(--n200);color:var(--n400);cursor:not-allowed}
.submit-btn:active{transform:scale(.99)}

.sum-note{font-size:11px;color:var(--n400);text-align:center;line-height:1.6;margin-top:10px}

/* ── BOTTOM BAR ──────────────────────────── */
.btm{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--n100);padding:10px 16px 14px;display:flex;align-items:center;gap:12px;z-index:100;box-shadow:0 -4px 16px rgba(0,0,0,.07)}
.btm-prog{flex:1;height:4px;background:var(--n100);border-radius:999px;overflow:hidden}
.btm-fill{height:100%;background:var(--g400);border-radius:999px;transition:width .3s ease}
.btm-lbl{font-size:11px;color:var(--n400);font-weight:600;white-space:nowrap;font-family:monospace}

/* ── SAVED INDICATOR ─────────────────────── */
.saved-pill{position:fixed;top:8px;right:8px;background:rgba(10,61,28,.9);color:var(--g200);font-size:10px;font-weight:600;padding:4px 10px;border-radius:999px;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none}
.saved-pill.show{opacity:1}

/* ── TOAST ────────────────────────────────── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--n900);color:white;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:999;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:420px){
  .fields{grid-template-columns:1fr}
  .f.wide{grid-column:1}
  .g-grid{grid-template-columns:1fr}
  .g-f.wide{grid-column:1}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-top">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L4 7v10l8 5 8-5V7L12 2zm0 2.3l6 3.7v8l-6 3.7L6 16V8l6-3.7z"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Greenergy</div>
        <div class="brand-sub">Ascensores · Estado inicial</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="conn-pill online" id="conn-pill">
        <div class="conn-dot"></div>
        <span id="conn-txt">En línea</span>
      </div>
    </div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="prog-row">
    <span id="prog-label">Datos generales</span>
    <span class="prog-pct" id="prog-pct">0%</span>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" onclick="goSec(0)">General</div>
    <div class="tab" onclick="goSec(1)">C. Máquinas</div>
    <div class="tab" onclick="goSec(2)">T. Cabina</div>
    <div class="tab" onclick="goSec(3)">Recorrido</div>
    <div class="tab" onclick="goSec(4)">Foso</div>
    <div class="tab" onclick="goSec(5)">Cabina</div>
    <div class="tab" onclick="goSec(6)">P. Hall</div>
    <div class="tab" onclick="goSec(7)">Resumen</div>
  </div>
</div>

<div class="offline-banner" id="offline-banner">
  Sin conexión — el registro se guarda localmente y se sincronizará al recuperar señal
</div>

<div class="main" id="main"></div>

<div class="btm">
  <div class="btm-prog"><div class="btm-fill" id="btm-fill" style="width:0%"></div></div>
  <div class="btm-lbl" id="btm-lbl">0 / 70 ítems</div>
</div>

<div class="saved-pill" id="saved-pill">Guardado ✓</div>
<div class="toast" id="toast"></div>

<script>
// ─── DATA ──────────────────────────────────────────────────────────────────
const SECS=[
  {id:'gen', label:'General'},
  {id:'cm',  label:'Cuarto de máquinas', icon:'⚙️', color:'#0f5526', items:14, photos:30},
  {id:'tc',  label:'Techo de cabina',    icon:'🔧', color:'#1a7040', items:13, photos:21},
  {id:'rec', label:'Recorrido / hueco',  icon:'↕️', color:'#2d6a1e', items:12, photos:22},
  {id:'fos', label:'Foso',               icon:'⬇️', color:'#3d5c10', items:11, photos:15},
  {id:'cab', label:'Cabina',             icon:'🚪', color:'#0d4f6e', items:12, photos:19},
  {id:'pu',  label:'Puertas de hall',    icon:'🚪', color:'#3d3d3a', items: 8, photos:12},
  {id:'sum', label:'Resumen'}
];

const ITEMS={
  cm:[
    {id:'cm01',name:'Máquina de tracción',ntc:'NTC §5.2',
     photos:['Vista completa','Placa de especificaciones','Estado del freno','Bancada / base'],
     fields:[['Marca','Modelo'],['Voltaje (V)','Freno (VDC)'],['Peso (kg)','Carga máx. (kg)'],['Tipo','N.° de serie']]},
    {id:'cm02',name:'Polea de tracción',ntc:'NTC §5.2',
     photos:['Vista completa','Detalle canales'],
     fields:[['Diámetro (mm)','N.° de canales'],['Estado de canales','Material']]},
    {id:'cm03',name:'Cables de tracción',ntc:'NTC §9.1',
     photos:['Vista general','Detalle de desgaste'],
     fields:[['Diámetro (mm)','N.° de cables'],['Material / construcción','Longitud aprox. (m)']]},
    {id:'cm04',name:'Control electrónico',ntc:'NTC §6.1',
     photos:['Vista frontal','Vista interior','Placa de bornes'],
     fields:[['Marca','Modelo'],['Voltaje','Año aprox.']]},
    {id:'cm05',name:'Limitador de velocidad',ntc:'NTC §9.9',
     photos:['Vista completa','Placa de datos','Cable y grilletes'],
     fields:[['Marca','Modelo'],['Velocidad de disparo (m/s)','Estado del cable']]},
    {id:'cm06',name:'Caja de breakers / totalizador',ntc:'',
     photos:['Vista frontal','Identificación de circuitos'],
     fields:[['Voltaje entrada','Capacidad totalizador (A)'],['N.° de breakers','Estado general'],['¿120 V (Fase/Neutro) independiente?','Puesta a tierra']],
     selects:{'¿120 V (Fase/Neutro) independiente?':['—','Sí','No'],'Puesta a tierra':['—','Sí','No','Parcial']}},
    {id:'cm07',name:'Transformador de seguridades',ntc:'',
     photos:['Vista completa','Placa de datos'],

// ─── STATE ─────────────────────────────────────────────────────────────────
const URL_PARAMS=new URLSearchParams(window.location.search);
const URL_CODE=URL_PARAMS.get('proyecto')||'';
const SK=URL_CODE?'grn_ei_'+URL_CODE:'grn_ei_new';
let cfg={dbl:false,disc:false};
let gdata={cliente:'',dir:'',torre:'',ascensor:'',fecha:new Date().toISOString().split('T')[0],tecnico:'',codigo:URL_CODE,marca:'',paradas:'',cap:'',vel:'',traccion:'Gearless 1:1',tension:'380 V',puertas:'Automáticas'};
let state={};
let curSec=0;
let online=navigator.onLine;

function initState(){
  Object.values(ITEMS).flat().forEach(it=>{
    state[it.id]={cond:null,fields:{},photos:{}};
  });
}

function save(){
  try{
    localStorage.setItem(SK,JSON.stringify({cfg,gdata,state,curSec}));
    flashSaved();
  }catch(e){}
}

function load(){
  try{
    const d=localStorage.getItem(SK);
    if(!d)return;
    const p=JSON.parse(d);
    if(p.cfg)cfg=p.cfg;
    if(p.gdata)gdata=p.gdata;
    if(p.state)state=p.state;
  }catch(e){}
}

function flashSaved(){
  const el=document.getElementById('saved-pill');
  el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),1800);
}

// ─── CONNECTIVITY ───────────────────────────────────────────────────────────
function updateConn(){
  online=navigator.onLine;
  const pill=document.getElementById('conn-pill');
  const txt=document.getElementById('conn-txt');
  const banner=document.getElementById('offline-banner');
  pill.className='conn-pill '+(online?'online':'offline');
  txt.textContent=online?'En línea':'Sin señal';
  banner.classList.toggle('show',!online);
}
window.addEventListener('online',updateConn);
window.addEventListener('offline',updateConn);

// ─── NAVIGATION ─────────────────────────────────────────────────────────────
function goSec(idx){
  curSec=idx;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  render(idx);
  updateProg();
  window.scrollTo(0,0);
  save();
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function render(idx){
  const m=document.getElementById('main');
  if(idx===0){m.innerHTML=renderGen();restoreGen();return;}
  if(idx===7){m.innerHTML=renderSum();initSign();return;}
  const keys=['cm','tc','rec','fos','cab','pu'];
  const key=keys[idx-1];
  const sec=SECS[idx];
  const items=ITEMS[key].filter(it=>!it.onlyIf||cfg[it.onlyIf]);
  const done=items.filter(it=>state[it.id]?.cond).length;

  let html=`<div class="sec-hdr">
    <div class="sec-icon" style="background:${sec.color}22">${sec.icon}</div>
    <div class="sec-info"><h2>${sec.label}</h2><p>${items.length} ítems · ${items.reduce((s,i)=>s+i.photos.length,0)} fotos</p></div>
    <div class="sec-counter"><div class="num">${done}</div><div class="lbl">completados</div></div>
  </div>`;

  if(idx===2&&cfg.dbl) html+=`<div class="c-notice">Doble acceso activo — motor, variador, banda infrarroja y gate switch se registran por cada puerta.</div>`;
  if(idx===5&&cfg.disc) html+=`<div class="c-notice">Botonera para discapacitados activa — ítem 02 habilitado.</div>`;

  items.forEach(it=>{ html+=renderItem(it); });

  html+=`<div class="sec-nav">
    <button class="nav-btn nav-prev" onclick="goSec(${idx-1})" ${idx===1?'disabled':''}>← Anterior</button>
    <button class="nav-btn nav-next" onclick="goSec(${idx+1})">${idx===6?'Ver resumen →':'Siguiente →'}</button>
  </div>`;
  m.innerHTML=html;
}

function renderItem(it){
  const st=state[it.id]||{cond:null,fields:{},photos:{}};
  const c=st.cond;
  const pd=Object.values(st.photos).filter(Boolean).length;
  const pt=it.photos.length;
  const chipCls=pd===0?'ph-chip none':pd<pt?'ph-chip part':'ph-chip full';

  const ringMap={good:'✓',regular:'~',bad:'!',absent:'✗'};
  const ringCls=c?`status-ring ${c}`:'status-ring';

  let cardCls='item';
  if(c) cardCls+=' done';
  if(c==='bad'||c==='absent') cardCls+=' crit';

  // fields html
  let fhtml='<div class="fields">';
  it.fields.forEach(pair=>{
    pair.forEach((f,fi)=>{
      if(!f) return;
      const v=st.fields[f]||'';
      const al=it.alerts?.find(a=>a.f===f);
      const alOn=al&&al.check(v);
      const alId=`al-${it.id}-${f.replace(/\s/g,'_')}`;
      const selOpts=it.selects?.[f];
      if(selOpts){
        fhtml+=`<div class="f ${fi===0&&pair.length===1?'wide':''}">
          <label>${f}</label>
          <select onchange="sf('${it.id}','${f}',this.value)">
            ${selOpts.map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('')}
          </select>
        </div>`;
      } else {
        fhtml+=`<div class="f ${fi===0&&pair.length===1?'wide':''}">
          <label>${f}</label>
          <input type="text" placeholder="—" value="${v.replace(/"/g,'&quot;')}"
            oninput="sf('${it.id}','${f}',this.value)"
            ${al?`onblur="chkAl('${it.id}','${f}',this.value,'${alId}')"`:''}
          >
          ${al?`<div class="f-alert ${alOn?'on':''}" id="${alId}">${al.msg}</div>`:''}
        </div>`;
      }
    });
  });
  fhtml+=`<div class="f wide"><label>Observaciones</label>
    <textarea placeholder="Anotar detalles relevantes..." oninput="sf('${it.id}','_obs',this.value)">${(st.fields['_obs']||'').replace(/</g,'&lt;')}</textarea>
  </div></div>`;

  // photos html
  let phtml='<div class="ph-grid">';
  it.photos.forEach((ph,pi)=>{
    const shot=st.photos[pi];
    const displayThumb=st.photoDisplay?.[pi] || st.photoThumbs?.[pi];
    phtml+=`<div class="ph-slot">
      <div class="ph-box ${shot?'shot':''}" id="phbox-${it.id}-${pi}" onclick="trigPh('${it.id}',${pi})">
        ${shot && displayThumb
          ?`<img src="${displayThumb}" alt="foto"><div class="ph-del" onclick="event.stopPropagation();delPh('${it.id}',${pi})">✕</div>`
          :shot
            ?`<div class="ph-ico">✓</div><div class="ph-lbl">Cargada</div>`
            :`<div class="ph-ico">⊞</div><div class="ph-lbl">Tomar</div>`}
      </div>
      <div class="ph-name">${ph}</div>
    </div>
    <input type="file" accept="image/*" capture="environment" class="ph-input"
      id="phi-${it.id}-${pi}" onchange="capPh('${it.id}',${pi},this)">`;
  });
  phtml+='</div>';

  return `<div class="${cardCls}" id="card-${it.id}">
    <div class="item-hd" onclick="togItem('${it.id}')">
      <div class="${ringCls}">${c?ringMap[c]:''}</div>
      <div class="item-txt">
        <div class="item-name">${it.name}</div>
        ${it.ntc?`<div class="item-ntc">${it.ntc}</div>`:''}
      </div>
      <div class="item-right">
        <span class="${chipCls}">${pd}/${pt} 📷</span>
        <span class="chev">▼</span>
      </div>
    </div>
    <div class="item-bd" id="bd-${it.id}">
      <div class="cond-wrap">
        <div class="micro-label">Condición inicial</div>
        <div class="cond-row">
          <button class="cond-btn ${c==='good'?'g':''}" onclick="setCond('${it.id}','good')">Bueno</button>
          <button class="cond-btn ${c==='regular'?'r':''}" onclick="setCond('${it.id}','regular')">Regular</button>
          <button class="cond-btn ${c==='bad'?'b':''}" onclick="setCond('${it.id}','bad')">Malo</button>
          <button class="cond-btn ${c==='absent'?'a':''}" onclick="setCond('${it.id}','absent')">Ausente</button>
        </div>
      </div>
      ${fhtml}
      <div class="photos">
        <div class="micro-label">Registro fotográfico (${pt} fotos)</div>
        ${phtml}
      </div>
    </div>
  </div>`;
}

function restoreGen(){
  const map={
    'g-cli':'cliente','g-dir':'dir','g-tor':'torre','g-fec':'fecha',
    'g-tec':'tecnico','g-cod':'codigo','g-mar':'marca',
    'g-par':'paradas','g-cap':'cap','g-vel':'vel'
  };
  Object.entries(map).forEach(([id,key])=>{
    const el=document.getElementById(id);
    if(el&&gdata[key]) el.value=gdata[key];
  });
  // restore ascensor selector
  if(gdata.ascensor){
    const asc=gdata.ascensor;
    const tipo=document.getElementById('g-asc-tipo');
    const num=document.getElementById('g-asc-num');
    const par=document.getElementById('g-asc-par');
    const lib=document.getElementById('g-asc-libre');
    if(tipo){
      if(/^Ascensor \d+$/.test(asc)){
        tipo.value='num';
        if(num) num.value=asc.replace('Ascensor ','');
      } else if(asc==='Par'||asc==='Impar'){
        tipo.value='par';
        if(par) par.value=asc;
      } else if(asc){
        tipo.value='libre';
        if(lib) lib.value=asc;
      }
      buildAscId();

  const codEl=document.getElementById('g-cod');

    codEl.readOnly=true;
    codEl.style.background='var(--g50)';
    codEl.style.color='var(--g700)';

  }
  const tra=document.getElementById('g-tra');
  if(tra) tra.value=gdata.traccion||'Gearless 1:1';
  const ten=document.getElementById('g-ten');
  if(ten) ten.value=gdata.tension||'380 V';

}

function renderSum(){
  const all=Object.values(ITEMS).flat().filter(it=>!it.onlyIf||cfg[it.onlyIf]);
  const tot=all.length;
  let done=0,good=0,reg=0,bad=0,abs=0,phPend=0;
  const issues=[];
  all.forEach(it=>{
    const st=state[it.id]||{};
    if(st.cond) done++;
    if(st.cond==='good') good++;
    if(st.cond==='regular') reg++;
    if(st.cond==='bad'){bad++;issues.push({name:it.name,type:'bad'});}
    if(st.cond==='absent'){abs++;issues.push({name:it.name,type:'absent'});}
    const pd=Object.values(st.photos||{}).filter(Boolean).length;
    phPend+=(it.photos.length-pd);
  });

  const issHtml=issues.length
    ?issues.map(i=>`<div class="issue">
        <div class="i-dot" style="background:${i.type==='bad'?'#ef4444':'#8b5cf6'}"></div>

      </div>`).join('')
    :`<div style="padding:10px 16px;font-size:12px;color:var(--n400)">Sin hallazgos críticos registrados</div>`;

  const syncHtml=!online?`<div class="sync-card show" id="sync-card">
    <p>Sin conexión — hay ${Object.values(state).filter(s=>s.cond).length} ítems guardados localmente listos para sincronizar.</p>
    <button class="sync-btn" onclick="syncData()">Sincronizar cuando haya señal</button>
  </div>`:'';

  return `<div class="sum">
    <div class="s-card">
      <div class="s-hdr">Resumen del registro</div>
      <div class="s-row"><span class="s-lbl">Ítems completados</span><span class="s-val ${done===tot?'ok':'warn'}">${done} / ${tot}</span></div>
      <div class="s-row"><span class="s-lbl">En buen estado</span><span class="s-val ok">${good}</span></div>
      <div class="s-row"><span class="s-lbl">Estado regular</span><span class="s-val warn">${reg}</span></div>
      <div class="s-row"><span class="s-lbl">En mal estado</span><span class="s-val bad">${bad}</span></div>
      <div class="s-row"><span class="s-lbl">Ausentes / no instalados</span><span class="s-val bad">${abs}</span></div>
      <div class="s-row"><span class="s-lbl">Fotos pendientes</span><span class="s-val ${phPend===0?'ok':'warn'}">${phPend}</span></div>
    </div>
    <div class="s-card">
      <div class="s-hdr">Hallazgos críticos — Malo / Ausente</div>
      <div class="issues">${issHtml}</div>
    </div>
    ${syncHtml}
    <div class="sign-card">
      <h3>Firma del técnico</h3>
      <canvas class="sign-canvas" id="sign-c"></canvas>
      <button class="sign-clear" onclick="clrSign()">Borrar firma</button>

    <button class="submit-btn" id="sub-btn" onclick="submit()">Enviar registro completo</button>
    <div class="sum-note">
      ${phPend>0?`⚠ Hay ${phPend} foto(s) pendiente(s). Puedes enviar y completarlas luego — recibirás un recordatorio en 24 h.<br>`:''}
      ${!online?'Sin conexión — el registro se guardará localmente y se enviará automáticamente al recuperar señal.':'Al enviar, el registro se guardará en Airtable y se notificará al coordinador.'}

function trigPh(id,pi){

function capPh(id,pi,inp){
  if(!inp.files?.length) return;
  const file=inp.files[0];
  if(!state[id]) state[id]={cond:null,fields:{},photos:{}};
  state[id].photos[pi]=file.name;
  if(!state[id].photoThumbs) state[id].photoThumbs={};

  const reader=new FileReader();
  reader.onload=e=>{
    // Create thumbnail via canvas — max 120x90px
    const img=new Image();
    img.onload=()=>{
      // Full-res version (max 800x600) for sending to Google Drive
      const canvas=document.createElement('canvas');
      const maxW=800,maxH=600;
      let w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const fullThumb=canvas.toDataURL('image/jpeg',0.75);
      // Small display thumbnail (max 156px wide) for UI
      const dCanvas=document.createElement('canvas');
      const dW=Math.min(w,156),dH=Math.round(h*(dW/w));
      dCanvas.width=dW;dCanvas.height=dH;
      dCanvas.getContext('2d').drawImage(img,0,0,dW,dH);
      const displayThumb=dCanvas.toDataURL('image/jpeg',0.7);
      state[id].photoThumbs[pi]=fullThumb;
      if(!state[id].photoDisplay) state[id].photoDisplay={};
      state[id].photoDisplay[pi]=displayThumb;
      const box=document.getElementById(`phbox-${id}-${pi}`);
      if(box){
        box.classList.add('shot');
        box.innerHTML=`<img src="${displayThumb}" alt="foto"><div class="ph-del" onclick="event.stopPropagation();delPh('${id}',${pi})">✕</div>`;
      }
      updateChip(id);
      updateProg();
      save();
      toast('Foto guardada ✓');
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function delPh(id,pi){
  if(!state[id]) return;
  delete state[id].photos[pi];
  if(state[id].photoThumbs) delete state[id].photoThumbs[pi];

  toast('Foto eliminada');
}

let signing=false,sCtx=null;
function initSign(){
  setTimeout(()=>{
    const c=document.getElementById('sign-c');
    if(!c||sCtx) return;
    c.width=c.offsetWidth;
    sCtx=c.getContext('2d');
    sCtx.strokeStyle=gdata.traccion?'#0a3d1c':'#0a3d1c';
    sCtx.lineWidth=2.5;
    sCtx.lineCap='round';
    sCtx.lineJoin='round';
    const pos=e=>{const r=c.getBoundingClientRect();return e.touches?{x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top}:{x:e.offsetX,y:e.offsetY};};
    c.addEventListener('mousedown',e=>{signing=true;const p=pos(e);sCtx.beginPath();sCtx.moveTo(p.x,p.y);});
    c.addEventListener('mousemove',e=>{if(!signing)return;const p=pos(e);sCtx.lineTo(p.x,p.y);sCtx.stroke();});
    c.addEventListener('mouseup',()=>signing=false);
    c.addEventListener('touchstart',e=>{e.preventDefault();signing=true;const p=pos(e);sCtx.beginPath();sCtx.moveTo(p.x,p.y);},{passive:false});
    c.addEventListener('touchmove',e=>{e.preventDefault();if(!signing)return;const p=pos(e);sCtx.lineTo(p.x,p.y);sCtx.stroke();},{passive:false});
    c.addEventListener('touchend',()=>signing=false);
  },200);
}
function clrSign(){if(sCtx){const c=document.getElementById('sign-c');sCtx.clearRect(0,0,c.width,c.height);}}

const WEBHOOK_URL       = 'https://n8n-service-0os1.onrender.com/webhook/greenergy-estado-inicial';
const WEBHOOK_FOTOS_URL = 'https://n8n-service-0os1.onrender.com/webhook/greenergy-foto';

function buildPayload(){
  const allItems = Object.values(ITEMS).flat().filter(it => !it.onlyIf || cfg[it.onlyIf]);
  const itemsArr = allItems.map(it => {
    const st = state[it.id] || {cond:null,fields:{},photos:{}};
    const photosDone = Object.values(st.photos).filter(Boolean).length;
    return {
      id: `${gdata.codigo}_${it.id}`,
      name: it.name,
      ntc: it.ntc || '',
      zona: (() => {
        const z = it.id.substring(0,2);
        const map = {cm:'Cuarto de máquinas',tc:'Techo de cabina',re:'Recorrido',fo:'Foso',ca:'Cabina',pu:'Puertas de hall'};
        return map[z] || '';
      })(),
      cond: st.cond || '',
      fields: st.fields || {},
      photosTotal: it.photos.length,
      photosDone: photosDone
    };
  });

  const issues = itemsArr.filter(i => i.cond === 'bad' || i.cond === 'absent');
  const photosPending = itemsArr.reduce((s,i) => s + (i.photosTotal - i.photosDone), 0);

  return {
    codigo: gdata.codigo || '',
    cliente: gdata.cliente || '',
    dir: gdata.dir || '',
    torre: gdata.torre || '',
    ascensor: gdata.ascensor || '',
    tecnico: gdata.tecnico || '',
    fecha: gdata.fecha || '',
    marca: gdata.marca || '',
    paradas: gdata.paradas || '',
    cap: gdata.cap || '',
    vel: gdata.vel || '',
    traccion: gdata.traccion || '',
    tension: gdata.tension || '',
    puertas: gdata.puertas || '',
    dbl: cfg.dbl || false,
    disc: cfg.disc || false,
    fechaEnvio: new Date().toISOString().split('T')[0],
    photosPending: photosPending,
    hallazgos: issues.length,
    items: itemsArr,
    esActualizacion: !!localStorage.getItem('grn_sent_'+URL_CODE)
  };
}

// Recolecta todas las fotos tomadas con sus metadatos
function collectPhotos(){
  const allItems = Object.values(ITEMS).flat().filter(it => !it.onlyIf || cfg[it.onlyIf]);
  const fotos = [];
  allItems.forEach(it => {
    const st = state[it.id];
    if(!st || !st.photos) return;
    const zona = (() => {
      const z = it.id.substring(0,2);
      const map = {cm:'Cuarto de máquinas',tc:'Techo de cabina',re:'Recorrido',fo:'Foso',ca:'Cabina',pu:'Puertas de hall'};
      return map[z] || '';
    })();
    it.photos.forEach((label, pi) => {
      if(st.photos[pi] && st.photoThumbs && st.photoThumbs[pi]){
        fotos.push({
          itemId: it.id,
          fotoId: `${gdata.codigo}_${it.id}-${pi}`,
          label: label,
          zona: zona,
          data: st.photoThumbs[pi]
        });
      }
    });
  });
  return fotos;
}

// Sube fotos una por una al webhook de fotos
async function uploadPhotos(proyectoAirtableId, itemsMap){
  const fotos = collectPhotos();
  if(fotos.length === 0) return;

  let uploaded = 0;
  const total = fotos.length;
  const btn = document.getElementById('sub-btn');

  for(const foto of fotos){
    const rawItemId = foto.itemId.includes('_') ? foto.itemId.split('_').slice(1).join('_') : foto.itemId;
    const itemAirtableId = itemsMap[rawItemId] || null;
    try {
      await fetch(WEBHOOK_FOTOS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fotoId: foto.fotoId,
          proyectoAirtableId: proyectoAirtableId,
          itemAirtableId: itemAirtableId,
          label: foto.label,
          zona: foto.zona,
          data: foto.data
        })
      });
      uploaded++;
      if(btn) btn.textContent = `Subiendo fotos... ${uploaded}/${total}`;
    } catch(e){
      console.warn('Error subiendo foto', foto.fotoId, e);
    }
  }
  if(btn){
    btn.textContent = `✓ Enviado — ${uploaded}/${total} fotos subidas`;
    btn.style.background = 'var(--g400)';
    btn.style.color = 'var(--g900)';
    btn.disabled = false;
  }
  toast(`${uploaded} foto(s) subida(s) a Airtable ✓`);
}

async function submit(){
  const btn = document.getElementById('sub-btn');
  if(btn){ btn.disabled=true; btn.textContent='Enviando datos...'; }

  const payload = buildPayload();

  if(!online){
    localStorage.setItem('grn_pending_payload', JSON.stringify(payload));
    toast('Sin señal — guardado localmente ✓');
    if(btn){ btn.disabled=false; btn.textContent='Guardado localmente ✓'; btn.style.background='var(--amber)'; }
    return;
  }

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(res.ok){
      let proyectoAirtableId = null;
      let itemsMap = {};
      try {
        const resData = await res.json();
        proyectoAirtableId = resData.proyectoAirtableId || null;
        // itemsMap: { "cm01": "recXXXX", "cm02": "recYYYY", ... }
        if(Array.isArray(resData.items)){
          resData.items.forEach(i => { if(i.itemId && i.airtableId) itemsMap[i.itemId] = i.airtableId; });
        }
      } catch(e){ console.warn('No se pudo parsear respuesta del webhook', e); }

      localStorage.setItem('grn_sent_'+URL_CODE, new Date().toISOString());
      localStorage.removeItem('grn_pending_payload');
      save();
      toast('Datos enviados ✓ — subiendo fotos...');
      if(btn) btn.textContent = 'Subiendo fotos...';

      // Subir fotos en segundo plano
      if(proyectoAirtableId){
        await uploadPhotos(proyectoAirtableId, itemsMap);
      } else {
        if(btn){ btn.textContent='✓ Enviado — toca para reenviar'; btn.style.background='var(--g400)'; btn.style.color='var(--g900)'; btn.disabled=false; }
        toast('Registro enviado a Airtable ✓');
      }
    } else {
      throw new Error('Error ' + res.status);
    }
  } catch(e){
    toast('Error al enviar — guardado localmente');
    localStorage.setItem('grn_pending_payload', JSON.stringify(payload));
    if(btn){ btn.disabled=false; btn.textContent='Reintentar envío'; btn.style.background='var(--red)'; }
  }
}

async function syncData(){
  if(!online){ toast('Aún sin señal — esperando conexión...'); return; }
  const pending = localStorage.getItem('grn_pending_payload');
  if(!pending){ toast('No hay datos pendientes de sincronizar'); return; }
  toast('Sincronizando con Airtable...');
  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: pending
    });
    if(res.ok){
      toast('Sincronizado correctamente ✓');
      localStorage.removeItem('grn_pending_payload');
    } else {
      throw new Error('Error ' + res.status);
    }
  } catch(e){
    toast('Error al sincronizar — intenta de nuevo');
  }
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),2400);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
initState();
load();
updateConn();

if(!URL_CODE){
  // No project code in URL — show welcome screen
  document.getElementById('main').innerHTML=`
    <div style="padding:32px 20px;max-width:480px;margin:0 auto;text-align:center">
      <div style="width:64px;height:64px;background:var(--g100);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px">📋</div>
      <h2 style="font-size:18px;font-weight:700;color:var(--n900);margin-bottom:10px">Formulario de estado inicial</h2>
      <p style="font-size:13px;color:var(--n500);line-height:1.6;margin-bottom:24px">Este formulario debe abrirse con un código de proyecto. Contacta al coordinador para obtener el link correcto.</p>
      <div style="background:var(--n100);border-radius:var(--r-lg);padding:16px;font-size:12px;color:var(--n600);text-align:left">
        <div style="font-weight:600;margin-bottom:6px">Formato del link:</div>
        <code style="font-size:11px;color:var(--g700)">...formulario-greenergy/?proyecto=GRN-2024-001</code>
      </div>
    </div>`;
  document.getElementById('tabs').style.display='none';
  document.getElementById('btm').style.display='none';
} else {
  // Has project code — check if resuming existing session
  const existing=localStorage.getItem(SK);
  if(existing){
    const parsed=JSON.parse(existing);
    const allItems=Object.values(ITEMS).flat();
    const done=allItems.filter(it=>parsed.state&&parsed.state[it.id]?.cond).length;
    if(done>0){
      showResumeToast(done, allItems.length);
    }
  }
  goSec(0);
  updateProg();
}

function showResumeToast(done, total){
  toast(`Retomando proyecto ${URL_CODE} — ${done}/${total} ítems registrados`);
}
