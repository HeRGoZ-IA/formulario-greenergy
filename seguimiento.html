<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Greenergy — Seguimiento móvil V2</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --g900:#062812; --g850:#083116; --g800:#0a3d1c; --g700:#0f5526; --g600:#156b30;
    --g500:#1a853b; --g400:#22a44a; --g300:#3dc463; --g200:#7ddd99;
    --n900:#0d0f0e; --n850:#151917; --n800:#1a1e1c; --n700:#2b312d; --n600:#414a44;
    --n500:#5c6860; --n400:#7e8e84; --n300:#a8b5ae; --n200:#cdd8d2; --n100:#e4ece8;
    --amber:#f59e0b; --red:#ef4444; --blue:#3b82f6; --purple:#8b5cf6;
    --font:'DM Sans',sans-serif; --r:12px; --r-lg:16px; --r-xl:22px;
    --header-h:64px; --nav-h:72px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--n900);color:var(--n100);font-family:var(--font);-webkit-tap-highlight-color:transparent}
  body{overflow:hidden}
  button,input,select,textarea{font-family:var(--font)}
  button{cursor:pointer;border:none}
  .hidden{display:none !important}
  .app{height:100%;display:flex;flex-direction:column}
  .screen{display:none;height:100%}
  .screen.active{display:flex;flex-direction:column}
  .center-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .state-card,.login-card{width:min(100%,420px);background:var(--n800);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-xl);padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .brand-mark{width:38px;height:38px;border-radius:10px;background:var(--g500);display:flex;align-items:center;justify-content:center;color:var(--g900);font-weight:700}
  .brand-title{font-size:18px;font-weight:700}
  .muted{color:var(--n400)}
  .title{font-size:18px;font-weight:700;margin:0 0 8px}
  .desc{font-size:13px;line-height:1.5;color:var(--n300);margin:0 0 16px}
  .input,.textarea,.select{width:100%;border-radius:14px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04);color:var(--n100);padding:14px;font-size:15px;outline:none}
  .textarea{min-height:92px;resize:vertical}
  .input:focus,.textarea:focus,.select:focus{border-color:var(--g400);background:rgba(255,255,255,.06)}
  .btn{min-height:48px;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary{background:var(--g600);color:#fff}
  .btn-primary:hover{background:var(--g500)}
  .btn-secondary{background:rgba(255,255,255,.06);color:var(--n200);border:1px solid rgba(255,255,255,.08)}
  .btn-block{width:100%}
  .spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.1);border-top-color:var(--g400);animation:spin .85s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .mobile-app{height:100%;display:flex;flex-direction:column}
  .header{height:var(--header-h);flex-shrink:0;padding:10px 14px;background:var(--n850);border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .header-left,.header-right{display:flex;align-items:center;gap:8px}
  .icon-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.06);color:var(--n100);display:flex;align-items:center;justify-content:center;font-size:17px;border:1px solid rgba(255,255,255,.08)}
  .header-title-wrap{min-width:0;flex:1}
  .header-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .header-sub{display:flex;align-items:center;gap:6px;color:var(--n400);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden}
  .badge{display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:700}
  .badge-green{background:rgba(34,164,74,.16);color:var(--g200)}
  .badge-amber{background:rgba(245,158,11,.16);color:#fcd34d}
  .badge-red{background:rgba(239,68,68,.16);color:#fecaca}
  .badge-blue{background:rgba(59,130,246,.16);color:#bfdbfe}
  .badge-gray{background:rgba(255,255,255,.07);color:var(--n300)}
  .content{flex:1;overflow:auto;padding:14px 14px calc(var(--nav-h) + 14px)}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--n400);margin:6px 0 10px;font-weight:700}
  .card{background:var(--n800);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-lg);padding:14px;margin-bottom:12px}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kv.one{grid-template-columns:1fr}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--n400)}
  .field .value{font-size:14px;color:var(--n100);line-height:1.35}
  .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:12px}
  .stat-value{font-size:22px;font-weight:700}
  .stat-label{font-size:11px;color:var(--n400);margin-top:2px}
  .bottom-nav{height:var(--nav-h);flex-shrink:0;background:var(--n850);border-top:1px solid rgba(255,255,255,.07);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:6px}
  .nav-btn{border-radius:14px;background:transparent;color:var(--n400);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700}
  .nav-btn .nav-ic{font-size:18px;line-height:1}
  .nav-btn.active{background:rgba(34,164,74,.12);color:var(--g200)}
  .chips{display:flex;gap:8px;overflow:auto;padding-bottom:2px;margin-bottom:10px}
  .sticky-advance{position:sticky;top:-14px;z-index:12;margin:-14px -14px 12px;padding:14px 14px 12px;background:linear-gradient(180deg,var(--n900) 0%,var(--n900) 82%,rgba(13,15,14,.92) 100%);border-bottom:1px solid rgba(255,255,255,.05)}
  .chip{flex:0 0 auto;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:700;background:rgba(255,255,255,.05);color:var(--n300);border:1px solid rgba(255,255,255,.08)}
  .chip.active{background:rgba(34,164,74,.14);color:var(--g200);border-color:rgba(34,164,74,.24)}
  .task-card{padding:0;overflow:hidden}
  .task-head{display:flex;gap:10px;align-items:flex-start;padding:14px;cursor:pointer}
  .task-main{min-width:0;flex:1}
  .task-id{font-size:10px;color:var(--n400);font-weight:700;margin-bottom:4px}
  .task-name{font-size:14px;font-weight:700;line-height:1.3}
  .task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .task-meta .mini{font-size:10px;border-radius:999px;padding:4px 8px;background:rgba(255,255,255,.05);color:var(--n300)}
  .task-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;flex-shrink:0}
  .mini-btn{min-height:38px;padding:0 12px;border-radius:12px;font-size:12px;font-weight:700}
  .task-body{display:none;border-top:1px solid rgba(255,255,255,.06);padding:14px}
  .task-card.open .task-body{display:block}
  .photo-note{font-size:11px;color:var(--amber);margin-top:8px;line-height:1.4}
  .preview-row{display:flex;gap:8px;overflow:auto;margin-top:8px}
  .preview{width:72px;height:72px;border-radius:12px;object-fit:cover;border:1px solid rgba(255,255,255,.08)}
  .hidden-file-input{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
  .photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .photo-action-btn{min-height:40px;padding:0 14px;border-radius:12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .preview-card{position:relative;flex:0 0 auto}
  .preview-remove{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.16)}
  .preview-label{font-size:11px;color:var(--n400);margin-top:8px}
  .photo-count{font-size:10px;border-radius:999px;padding:4px 8px;background:rgba(59,130,246,.16);color:#bfdbfe;font-weight:700}
  .list-card{background:var(--n800);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px;margin-bottom:12px}
  .list-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .list-title{font-size:14px;font-weight:700;line-height:1.3}
  .list-sub{font-size:12px;color:var(--n400);margin-top:4px}
  .list-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:50}
  .overlay.open{display:flex}
  .sheet{width:100%;max-height:88vh;overflow:auto;background:var(--n850);border-top-left-radius:22px;border-top-right-radius:22px;padding:16px 14px 22px;border-top:1px solid rgba(255,255,255,.08)}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .sheet-title{font-size:16px;font-weight:700}
  .close-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.06);color:var(--n100)}
  .form-grid{display:grid;grid-template-columns:1fr;gap:10px}
  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
  .actions-row{display:flex;gap:8px;margin-top:14px}
  .participants .row{display:flex;gap:8px;margin-bottom:8px}
  .empty-state{text-align:center;padding:30px 14px;color:var(--n400)}
  .empty-state h3{font-size:16px;color:var(--n200);margin:0 0 6px}
  .helper{font-size:12px;color:var(--n400);line-height:1.45}
  .caption{font-size:12px;color:var(--n400)}
  .divider{height:1px;background:rgba(255,255,255,.06);margin:14px 0}
  .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 12px);transform:translateX(-50%) translateY(8px);background:var(--n700);border:1px solid rgba(255,255,255,.1);color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.22s;z-index:80;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .zone-card{padding:0;overflow:hidden}
  .zone-head{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer}
  .zone-head:hover{background:rgba(255,255,255,.03)}
  .zone-main{min-width:0;flex:1}
  .zone-name{font-size:14px;font-weight:700;line-height:1.2}
  .zone-sub{font-size:11px;color:var(--n400);margin-top:4px}
  .zone-body{display:none;border-top:1px solid rgba(255,255,255,.06);padding:10px 12px 12px}
  .zone-card.open .zone-body{display:block}
  .task-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
  .task-line:last-child{border-bottom:none}
  .task-line-main{min-width:0;flex:1}
  .task-line-title{font-size:13px;font-weight:700;line-height:1.25}
  .task-line-sub{font-size:11px;color:var(--n400);margin-top:4px}
  .readonly-block{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:12px;margin-top:10px}
  .readonly-block .label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--n400);margin-bottom:4px}
  .readonly-block .value{font-size:13px;color:var(--n100);line-height:1.45}
  .richtext{font-size:13px;color:var(--n100);line-height:1.55;word-break:break-word}
  .richtext > *:first-child{margin-top:0}
  .richtext > *:last-child{margin-bottom:0}
  .richtext p{margin:0 0 10px}
  .richtext h1,.richtext h2,.richtext h3{margin:0 0 10px;color:#fff;line-height:1.2}
  .richtext h1{font-size:28px;font-weight:700}
  .richtext h2{font-size:22px;font-weight:700}
  .richtext h3{font-size:18px;font-weight:700}
  .richtext ul,.richtext ol{margin:0 0 10px 20px;padding:0}
  .richtext li{margin:0 0 6px}
  .richtext blockquote{margin:0 0 10px;padding:0 0 0 12px;border-left:2px solid rgba(255,255,255,.16);color:var(--n200)}
  .richtext .rt-checkbox{list-style:none;margin-left:-20px;padding-left:20px;position:relative}
  .richtext .rt-checkbox::before{content:'☐';position:absolute;left:0;color:var(--n300)}
  .richtext .rt-checkbox.checked::before{content:'☑';color:var(--g300)}

</style>
</head>
<body>
<div class="app">
  <div id="screen-login" class="screen active">
    <div class="center-wrap">
      <div class="login-card">
        <div class="brand-row">
          <div class="brand-mark">G</div>
          <div>
            <div class="brand-title">Greenergy Seguimiento</div>
            <div class="muted" style="font-size:12px">Versión móvil V2</div>
          </div>
        </div>
        <h2 class="title">Acceso de prueba</h2>
        <p class="desc">Esta versión usa el token de Airtable guardado en el dispositivo y debe abrirse con <strong>?pid=...</strong>.</p>
        <div style="display:grid;gap:10px">
          <input id="token-input" class="input" placeholder="Pega aquí tu token de Airtable" />
          <button class="btn btn-primary btn-block" onclick="saveTokenAndStart()">Ingresar</button>
        </div>
      </div>
    </div>
  </div>
  <div id="screen-state" class="screen">
    <div class="center-wrap">
      <div class="state-card">
        <div id="state-spinner-wrap" style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <span class="spinner"></span>
          <strong id="state-title">Cargando proyecto...</strong>
        </div>
        <p id="state-message" class="desc" style="margin-bottom:0">Espera un momento mientras se consulta la información del seguimiento.</p>
        <div id="state-actions" class="hidden" style="margin-top:14px;display:grid;gap:8px">
          <button class="btn btn-primary btn-block" onclick="init()">Reintentar</button>
          <button class="btn btn-secondary btn-block" onclick="logout()">Salir</button>
        </div>
      </div>
    </div>
  </div>
  <div id="screen-app" class="screen">
    <div class="mobile-app">
      <header class="header">
        <div class="header-left"><button class="icon-btn" onclick="goToProjectView()">←</button></div>
        <div class="header-title-wrap">
          <div id="header-title" class="header-title">Proyecto</div>
          <div class="header-sub"><span id="header-code">—</span><span>•</span><span id="header-status">—</span></div>
        </div>
        <div class="header-right"><button class="icon-btn" onclick="refreshAll()">↻</button></div>
      </header>
      <main id="content" class="content"></main>
      <nav class="bottom-nav">
        <button class="nav-btn active" data-view="proyecto" onclick="setView('proyecto')"><span class="nav-ic">🏗️</span><span>Proyecto</span></button>
        <button class="nav-btn" data-view="avance" onclick="setView('avance')"><span class="nav-ic">✅</span><span>Avance</span></button>
        <button class="nav-btn" data-view="novedades" onclick="setView('novedades')"><span class="nav-ic">⚠️</span><span>Novedades</span></button>
        <button class="nav-btn" data-view="reuniones" onclick="setView('reuniones')"><span class="nav-ic">🗒️</span><span>Reuniones</span></button>
      </nav>
    </div>
  </div>
</div>

<div id="sheet-overlay" class="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="sheet-title">Formulario</div>
      <button class="close-btn" onclick="closeSheet()">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const BASE_ID='app6WpUGWDLbyvl7k', TBL_PROYECTOS='tblVly4txK2GjYBid', TBL_SEGUIMIENTO_OBRA='tbla6QjQ1HnsWGdTN', TBL_SEGUIMIENTO_NOVEDADES='tblhQD2qW7stMElpw', TBL_SEGUIMIENTO_REUNIONES='tblOI8Zi9sUAOZS58', TOKEN_KEY='grn_at_token';
let AT_TOKEN=localStorage.getItem(TOKEN_KEY)||'', pid=null;
let state={view:'proyecto',project:null,codigoProyecto:'',projectTitle:'',items:[],novedades:[],reuniones:[],avanceSection:'pendientes',expandedTaskId:null,expandedZone:null,pendingTaskPhotos:{}};
const $=id=>document.getElementById(id);
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast._timer);showToast._timer=setTimeout(()=>t.classList.remove('show'),2200);}
function escapeHtml(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");}
function inlineRichText(value){return escapeHtml(value).replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/_(.+?)_/g,'<em>$1</em>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/__(.+?)__/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');}
function renderRichText(value){
  const raw=String(value??'').replace(/\r\n/g,'\n').trim();
  if(!raw) return '<div class="richtext"><p>Sin observación registrada</p></div>';
  const lines=raw.split('\n');
  const html=[];
  let i=0;
  while(i<lines.length){
    const trimmed=lines[i].trim();
    if(!trimmed){i++;continue;}
    const heading=trimmed.match(/^(#{1,3})\s+(.*)$/);
    if(heading){const level=heading[1].length;html.push(`<h${level}>${inlineRichText(heading[2])}</h${level}>`);i++;continue;}
    if(trimmed.startsWith('>')){
      const parts=[];
      while(i<lines.length && lines[i].trim().startsWith('>')){parts.push(lines[i].trim().replace(/^>\s?/,''));i++;}
      html.push(`<blockquote>${parts.map(inlineRichText).join('<br>')}</blockquote>`);
      continue;
    }
    if(/^(?:[-*])\s+/.test(trimmed) || /^\d+\.\s+/.test(trimmed) || /^\[(?: |x|X)\]\s+/.test(trimmed)){
      const ordered=/^\d+\.\s+/.test(trimmed);
      const tag=ordered?'ol':'ul';
      const parts=[];
      while(i<lines.length){
        const t=lines[i].trim();
        if(ordered && /^\d+\.\s+/.test(t)){parts.push(`<li>${inlineRichText(t.replace(/^\d+\.\s+/,''))}</li>`);i++;continue;}
        if(!ordered && /^\[(?: |x|X)\]\s+/.test(t)){const checked=/^\[(?:x|X)\]/.test(t);parts.push(`<li class="rt-checkbox ${checked?'checked':''}">${inlineRichText(t.replace(/^\[(?: |x|X)\]\s+/,''))}</li>`);i++;continue;}
        if(!ordered && /^(?:[-*])\s+/.test(t)){parts.push(`<li>${inlineRichText(t.replace(/^(?:[-*])\s+/,''))}</li>`);i++;continue;}
        break;
      }
      html.push(`<${tag}>${parts.join('')}</${tag}>`);
      continue;
    }
    const parts=[];
    while(i<lines.length && lines[i].trim() && !/^(#{1,3})\s+/.test(lines[i].trim()) && !lines[i].trim().startsWith('>') && !/^(?:[-*])\s+/.test(lines[i].trim()) && !/^\d+\.\s+/.test(lines[i].trim()) && !/^\[(?: |x|X)\]\s+/.test(lines[i].trim())){parts.push(inlineRichText(lines[i]));i++;}
    html.push(`<p>${parts.join('<br>')}</p>`);
  }
  return `<div class="richtext">${html.join('')}</div>`;
}
function airtableString(s){return String(s??'').replaceAll('"','\"');}
function nowIsoDate(){return new Date().toISOString();}
function getParam(name){return new URLSearchParams(window.location.search).get(name);}
function setScreen(name){['screen-login','screen-state','screen-app'].forEach(id=>$(id).classList.remove('active'));$(name).classList.add('active');}
function setStateScreen(title,message,isError=false){setScreen('screen-state');$('state-title').textContent=title;$('state-message').textContent=message;$('state-spinner-wrap').style.display=isError?'block':'flex';$('state-actions').classList.toggle('hidden',!isError);}
function getField(rec,names=[],fallback=''){if(!rec||!rec.fields)return fallback;for(const n of names){if(rec.fields[n]!=null&&rec.fields[n]!=='')return rec.fields[n];}return fallback;}
function formatDate(value){if(!value)return '—';const d=new Date(value);if(Number.isNaN(d.getTime()))return String(value);return d.toLocaleDateString('es-CO',{year:'numeric',month:'short',day:'numeric'});}
function statusBadge(status){const s=String(status||'').toLowerCase();if(s.includes('final'))return ['badge-green',status];if(s.includes('atras'))return ['badge-red',status];if(s.includes('acerc'))return ['badge-amber',status];if(s.includes('ejec'))return ['badge-blue',status];if(s.includes('sin iniciar'))return ['badge-gray',status];return ['badge-gray',status||'—'];}
function itemStatusClass(status){return String(status||'').toLowerCase().includes('term')?'badge-green':'badge-amber';}
function firstLinkedId(value){return Array.isArray(value)?value[0]:null;}

function getTaskHours(rec){
  const raw = Number(getField(rec,['Horas estimadas máx','Horas estimadas max','Horas estimadas mín','Horas estimadas min'],0));
  return Number.isFinite(raw) ? raw : 0;
}
function getPendingItems(){return state.items.filter(r=>!String(getField(r,['Estado ítem'],'')).toLowerCase().includes('term'));}

function projectStats(){
  const total=state.items.length;
  const terminadas=getCompletedItems().length;
  const pendientes=Math.max(0,total-terminadas);
  const horasTotales=state.items.reduce((s,r)=>s+getTaskHours(r),0);
  const horasTerminadas=getCompletedItems().reduce((s,r)=>s+getTaskHours(r),0);
  const horasPendientes=Math.max(0,horasTotales-horasTerminadas);
  const avance=horasTotales?Math.round((horasTerminadas/horasTotales)*100):0;
  return {total,terminadas,pendientes,avance,horasTotales,horasTerminadas,horasPendientes};
}
function groupItemsByZone(items=state.items){
  const out={};
  items.forEach(rec=>{
    const zona=getField(rec,['Zona'],'Sin zona')||'Sin zona';
    if(!out[zona]) out[zona]=[];
    out[zona].push(rec);
  });
  const preferred=['Cuarto de máquinas','Techo de cabina','Recorrido','Foso','Cabina','Puertas de hall','Sin zona'];
  return Object.entries(out)
    .sort((a,b)=>{
      const ia=preferred.indexOf(a[0]);
      const ib=preferred.indexOf(b[0]);
      if(ia===-1&&ib===-1) return a[0].localeCompare(b[0]);
      if(ia===-1) return 1;
      if(ib===-1) return -1;
      return ia-ib;
    })
    .map(([zona,records])=>({zona,records:records.sort((a,b)=>Number(getField(a,['Orden cronograma','Prioridad'],9999))-Number(getField(b,['Orden cronograma','Prioridad'],9999)))}));
}

function previewTaskFiles(id){

  }

    tempId:`tmp_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,
    file,
    previewUrl:URL.createObjectURL(file)

  state.pendingTaskPhotos[id]=current.concat(accepted);

async function fileToBase64Content(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const result=String(reader.result||'');
      const base64=result.includes(',')?result.split(',')[1]:result;
      resolve(base64);
    };
    reader.onerror=()=>reject(new Error('No se pudo leer una de las fotos.'));
    reader.readAsDataURL(file);
  });
}
async function compressImageIfNeeded(file){
  if(!String(file.type||'').startsWith('image/') || file.size<=4_500_000) return file;
  const dataUrl = await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error('No se pudo procesar una de las fotos.'));
    reader.readAsDataURL(file);
  });
  const img = await new Promise((resolve,reject)=>{
    const image=new Image();
    image.onload=()=>resolve(image);
    image.onerror=()=>reject(new Error('No se pudo procesar una de las fotos.'));
    image.src=dataUrl;
  });
  const maxDim=1600;
  let {width,height}=img;
  if(width>height && width>maxDim){ height=Math.round(height*(maxDim/width)); width=maxDim; }
  else if(height>=width && height>maxDim){ width=Math.round(width*(maxDim/height)); height=maxDim; }
  const canvas=document.createElement('canvas');
  canvas.width=width; canvas.height=height;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(img,0,0,width,height);
  let quality=0.86;
  let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
  while(blob && blob.size>4_800_000 && quality>0.45){
    quality-=0.08;
    blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
  }
  if(!blob) throw new Error('No se pudo comprimir una de las fotos.');
  return new File([blob], (file.name||'foto').replace(/\.[^.]+$/,'') + '.jpg', {type:'image/jpeg'});
}
async function uploadAttachmentToAirtable(recordId, fieldName, file){
  const prepared=await compressImageIfNeeded(file);

  const base64=await fileToBase64Content(prepared);
  const res=await fetch(`https://content.airtable.com/v0/${BASE_ID}/${recordId}/${encodeURIComponent(fieldName)}/uploadAttachment`,{
    method:'POST',
    headers:{
      'Authorization':`Bearer ${AT_TOKEN}`,
      'Content-Type':'application/json'
    },
    body:JSON.stringify({filename:prepared.name,contentType:prepared.type||'image/jpeg',file:base64})
  });
  const data=await res.json();
  if(!res.ok) throw new Error(data?.error?.message||`No se pudo subir ${prepared.name}`);
  return data;
}
async function uploadTaskAttachments(recordId, files){
  for(let i=0;i<files.length;i++){
    showToast(`Subiendo foto ${i+1} de ${files.length}...`);
    await uploadAttachmentToAirtable(recordId,'Fotos avance',files[i].file||files[i]);
  }
}
async function markTaskDone(id){
  try{await patchRecord(TBL_SEGUIMIENTO_OBRA,id,{'Estado ítem':'Terminado','Fecha terminación':nowIsoDate()});showToast('Tarea marcada como terminada');await init(false);state.view='avance';state.avanceSection='terminadas';state.expandedTaskId=id;renderView();}
  catch(err){console.error(err);showToast(err.message||'No se pudo actualizar la tarea');}
}
async function markTaskPending(id){
  try{await patchRecord(TBL_SEGUIMIENTO_OBRA,id,{'Estado ítem':'Pendiente','Fecha terminación':null});showToast('Tarea reabierta');await init(false);state.view='avance';state.avanceSection='pendientes';state.expandedTaskId=id;renderView();}
  catch(err){console.error(err);showToast(err.message||'No se pudo reabrir la tarea');}
}
async function saveAndCompleteTask(id){
  try{
    const obs=(document.getElementById(`obs-${id}`)?.value||'').trim();
    if(!obs){showToast('Escribe una observación antes de terminar');return;}
    const pendingPhotos=getPendingTaskPhotos(id);
    if(pendingPhotos.length>3){showToast('Máximo 3 fotos por tarea');return;}
    if(pendingPhotos.length){
      await uploadTaskAttachments(id,pendingPhotos);
    }
    await patchRecord(TBL_SEGUIMIENTO_OBRA,id,{'Observaciones ejecución':obs,'Estado ítem':'Terminado','Fecha terminación':nowIsoDate()});
    (state.pendingTaskPhotos[id]||[]).forEach(ph=>{ try{ URL.revokeObjectURL(ph.previewUrl); }catch(_){ } });
    delete state.pendingTaskPhotos[id];
    showToast('Tarea terminada');
    await init(false);
    state.view='avance';
    state.avanceSection='terminadas';
    state.expandedTaskId=id;
    renderView();
  }catch(err){console.error(err);showToast(err.message||'No se pudo terminar la tarea');}
}
function openSheet(title,html){$('sheet-title').textContent=title;$('sheet-body').innerHTML=html;$('sheet-overlay').classList.add('open');}
function closeSheet(){$('sheet-overlay').classList.remove('open');$('sheet-body').innerHTML='';}
function itemOptions(selectedValue=''){return state.items.map(rec=>{const val=rec.id,label=`${getField(rec,['ID ítem'],'')} — ${getField(rec,['Nombre ítem'],'Ítem')}`;return `<option value="${val}" ${val===selectedValue?'selected':''}>${escapeHtml(label)}</option>`;}).join('');}
function openNovedadForm(id=''){const rec=id?state.novedades.find(r=>r.id===id):null,tipo=rec?getField(rec,['Tipo novedad'],'Operativa'):'Operativa',impacto=rec?getField(rec,['Impacto'],'Medio'):'Medio',detiene=rec?!!getField(rec,['¿Detiene la obra?'],false):false,descripcion=rec?getField(rec,['Descripción'],''):'',accion=rec?getField(rec,['Acción requerida'],''):'',responsable=rec?getField(rec,['Responsable'],''):'',estado=rec?getField(rec,['Estado novedad'],'Abierta'):'Abierta',rel=rec?firstLinkedId(getField(rec,['Ítem relacionado'],[])):'';openSheet(rec?'Editar novedad':'Nueva novedad',`<div class="form-grid"><select id="nov-tipo" class="select">${['Operativa','Cliente','Técnico','Seguridad','Acceso','Otro'].map(v=>`<option ${v===tipo?'selected':''}>${v}</option>`).join('')}</select><select id="nov-item" class="select"><option value="">General del proyecto</option>${itemOptions(rel)}</select><textarea id="nov-desc" class="textarea" placeholder="Descripción">${escapeHtml(descripcion)}</textarea><select id="nov-impacto" class="select">${['Bajo','Medio','Alto'].map(v=>`<option ${v===impacto?'selected':''}>${v}</option>`).join('')}</select><div class="switch-row"><span>¿Detiene la obra?</span><input id="nov-detiene" type="checkbox" ${detiene?'checked':''} /></div><textarea id="nov-accion" class="textarea" placeholder="Acción requerida">${escapeHtml(accion)}</textarea><input id="nov-resp" class="input" placeholder="Responsable" value="${escapeHtml(responsable)}" /><select id="nov-estado" class="select">${['Abierta','Cerrada'].map(v=>`<option ${v===estado?'selected':''}>${v}</option>`).join('')}</select><div class="helper">La evidencia en archivos se deja para la siguiente iteración.</div></div><div class="actions-row"><button class="btn btn-primary" style="flex:1" onclick="saveNovedad('${id}')">Guardar novedad</button><button class="btn btn-secondary" style="flex:1" onclick="closeSheet()">Cancelar</button></div>`);}
async function saveNovedad(id=''){try{const itemVal=$('nov-item').value,estado=$('nov-estado').value,fields={'Proyecto':[pid],'Tipo novedad':$('nov-tipo').value,'Descripción':$('nov-desc').value.trim(),'Impacto':$('nov-impacto').value,'¿Detiene la obra?':$('nov-detiene').checked,'Acción requerida':$('nov-accion').value.trim(),'Responsable':$('nov-resp').value.trim(),'Estado novedad':estado};if(itemVal)fields['Ítem relacionado']=[itemVal];if(!id)fields['Fecha novedad']=nowIsoDate();fields['Fecha cierre']=estado==='Cerrada'?nowIsoDate():null;if(id)await patchRecord(TBL_SEGUIMIENTO_NOVEDADES,id,fields);else await createRecord(TBL_SEGUIMIENTO_NOVEDADES,fields);closeSheet();showToast('Novedad guardada');await init(false);state.view='novedades';renderView();}catch(err){console.error(err);showToast(err.message||'No se pudo guardar la novedad');}}
function participantRows(values=[]){const rows=values.length?values:[''];return rows.map((v,idx)=>`<div class="row"><input class="input participant-input" placeholder="Participante ${idx+1}" value="${escapeHtml(v)}" /></div>`).join('');}
function openReunionForm(id=''){const rec=id?state.reuniones.find(r=>r.id===id):null,fecha=rec?getField(rec,['Fecha reunión'],''):'',tipo=rec?getField(rec,['Tipo reunión'],'Cliente'):'Cliente',participantesText=rec?getField(rec,['Participantes texto'],''):'',participantes=participantesText?String(participantesText).split('\n'):[''],temas=rec?getField(rec,['Temas tratados'],''):'',acuerdos=rec?getField(rec,['Acuerdos'],''):'',responsable=rec?getField(rec,['Responsable'],''):'';openSheet(rec?'Editar reunión':'Nueva reunión',`<div class="form-grid"><input id="reu-fecha" class="input" type="date" value="${escapeHtml(fecha?String(fecha).slice(0,10):'')}" /><select id="reu-tipo" class="select">${['Cliente','Técnico','Interventoría','Interna'].map(v=>`<option ${v===tipo?'selected':''}>${v}</option>`).join('')}</select><div class="participants"><div class="section-title" style="margin-top:4px">Participantes</div><div id="participants-wrap">${participantRows(participantes)}</div><button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="addParticipantRow()">+ Agregar participante</button></div><textarea id="reu-temas" class="textarea" placeholder="Temas tratados">${escapeHtml(temas)}</textarea><textarea id="reu-acuerdos" class="textarea" placeholder="Acuerdos">${escapeHtml(acuerdos)}</textarea><input id="reu-resp" class="input" placeholder="Responsable" value="${escapeHtml(responsable)}" /><div class="helper">La carga de acta/documento se deja para la siguiente iteración.</div></div><div class="actions-row"><button class="btn btn-primary" style="flex:1" onclick="saveReunion('${id}')">Guardar reunión</button><button class="btn btn-secondary" style="flex:1" onclick="closeSheet()">Cancelar</button></div>`);}
function addParticipantRow(){const wrap=$('participants-wrap'),count=wrap.querySelectorAll('.participant-input').length+1,div=document.createElement('div');div.className='row';div.innerHTML=`<input class="input participant-input" placeholder="Participante ${count}" />`;wrap.appendChild(div);}
async function saveReunion(id=''){try{const participantes=[...document.querySelectorAll('.participant-input')].map(i=>i.value.trim()).filter(Boolean).join('\n'),fields={'Proyecto':[pid],'Fecha reunión':$('reu-fecha').value||nowIsoDate().slice(0,10),'Tipo reunión':$('reu-tipo').value,'Participantes texto':participantes,'Temas tratados':$('reu-temas').value.trim(),'Acuerdos':$('reu-acuerdos').value.trim(),'Responsable':$('reu-resp').value.trim()};if(id)await patchRecord(TBL_SEGUIMIENTO_REUNIONES,id,fields);else await createRecord(TBL_SEGUIMIENTO_REUNIONES,fields);closeSheet();showToast('Reunión guardada');await init(false);state.view='reuniones';renderView();}catch(err){console.error(err);showToast(err.message||'No se pudo guardar la reunión');}}
async function init(resetView=true){try{pid=getParam('pid');if(!AT_TOKEN){setScreen('screen-login');$('token-input').value='';return;}const ok=await loadAll();if(!ok)return;setScreen('screen-app');if(resetView)state.view='proyecto';renderView();}catch(err){console.error(err);setStateScreen('No se pudo cargar el proyecto',err.message||'Ocurrió un error al consultar Airtable.',true);}}
window.addEventListener('load',init);
</script>
