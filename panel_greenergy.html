<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greenergy — Panel de Modernizaciones</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --g900:#062812; --g800:#0a3d1c; --g700:#0f5526; --g600:#156b30;
  --g500:#1a853b; --g400:#22a44a; --g300:#3dc463; --g200:#7ddd99;
  --g100:#bff0ce; --g50:#e8faf0;
  --n900:#0d0f0e; --n800:#1a1e1c; --n700:#2b312d; --n600:#414a44;
  --n500:#5c6860; --n400:#7e8e84; --n300:#a8b5ae; --n200:#cdd8d2;
  --n100:#e4ece8; --n50:#f2f7f4;
  --amber:#f59e0b; --amberL:#fef3c7; --amberD:#92400e;
  --red:#ef4444; --redL:#fef2f2; --redD:#991b1b;
  --blue:#3b82f6; --blueL:#eff6ff; --blueD:#1e40af;
  --purple:#8b5cf6; --purpleL:#faf5ff; --purpleD:#6b21a8;
  --font:'DM Sans',sans-serif;
  --mono:'DM Mono',monospace;
  --r:8px; --r-lg:14px; --r-xl:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--n900);color:var(--n100);font-family:var(--font);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:var(--font);cursor:pointer;border:none}

/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{background:var(--n800);border-bottom:1px solid rgba(255,255,255,.07);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:32px;height:32px;background:var(--g500);border-radius:8px;display:flex;align-items:center;justify-content:center}
.brand-mark svg{width:18px;height:18px;fill:var(--g900)}
.brand-name{font-size:15px;font-weight:600;color:white;letter-spacing:-.02em}
.brand-sub{font-size:11px;color:var(--n400);margin-left:2px}
.topbar-right{display:flex;align-items:center;gap:10px}
.btn-refresh{background:rgba(255,255,255,.06);color:var(--n300);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:6px 12px;font-size:12px;font-weight:500;transition:all .2s}
.btn-refresh:hover{background:rgba(255,255,255,.1);color:white}
.content{flex:1;overflow:hidden;display:flex}

/* ── SCREENS ── */
.screen{display:none;width:100%;height:100%;overflow-y:auto}
.screen.active{display:block}

/* ── LIST SCREEN ── */
.list-wrap{max-width:1100px;margin:0 auto;padding:28px 24px}
.list-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.list-hdr h1{font-size:20px;font-weight:600;color:white;letter-spacing:-.02em}
.stats-row{display:flex;gap:12px;margin-bottom:24px}
.stat{background:var(--n800);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-lg);padding:14px 18px;flex:1}
.stat-val{font-size:24px;font-weight:600;color:white;line-height:1}
.stat-lbl{font-size:11px;color:var(--n400);margin-top:4px;font-weight:500}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.proj-card{background:var(--n800);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-lg);padding:18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.proj-card:hover{border-color:var(--g500);background:var(--n700);transform:translateY(-1px)}
.proj-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--g500);opacity:0;transition:opacity .2s}
.proj-card:hover::before{opacity:1}
.proj-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.proj-code{font-family:var(--mono);font-size:11px;color:var(--g300);font-weight:500;background:rgba(34,164,74,.12);padding:3px 8px;border-radius:4px}
.dec-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px}
.dec-badge.pendiente{background:rgba(245,158,11,.15);color:var(--amber)}
.dec-badge.en-proceso{background:rgba(59,130,246,.15);color:#93c5fd}
.dec-badge.completo{background:rgba(34,164,74,.15);color:var(--g300)}
.proj-name{font-size:15px;font-weight:600;color:white;margin-bottom:3px;letter-spacing:-.01em}
.proj-sub{font-size:12px;color:var(--n400);margin-bottom:12px}
.proj-meta{display:flex;gap:14px;margin-bottom:12px}
.proj-meta-item{font-size:11px;color:var(--n500);display:flex;align-items:center;gap:4px}
.proj-meta-item span{color:var(--n300)}
.prog-wrap{margin-bottom:6px}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--n500);margin-bottom:5px}
.prog-bar{height:4px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-fill{height:100%;background:var(--g500);border-radius:999px;transition:width .4s ease}
.hallazgos-row{display:flex;gap:6px;margin-top:10px}
.hallazgo-chip{font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;display:flex;align-items:center;gap:4px}
.h-malo{background:rgba(239,68,68,.15);color:#fca5a5}
.h-ausente{background:rgba(139,92,246,.15);color:#c4b5fd}
.h-fotos{background:rgba(245,158,11,.15);color:#fcd34d}

/* ── DETAIL SCREEN ── */
.detail-wrap{display:flex;flex-direction:column;height:100%}
.detail-topbar{background:var(--n800);border-bottom:1px solid rgba(255,255,255,.07);padding:0 24px;height:52px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.btn-back{background:rgba(255,255,255,.06);color:var(--n300);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:6px 12px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;transition:all .2s}
.btn-back:hover{background:rgba(255,255,255,.1);color:white}
.detail-title{font-size:14px;font-weight:600;color:white;flex:1}
.detail-code{font-family:var(--mono);font-size:11px;color:var(--g300);background:rgba(34,164,74,.12);padding:3px 8px;border-radius:4px}
.detail-body{flex:1;overflow:hidden;display:flex;flex-direction:column}
.tabs-row{background:var(--n800);border-bottom:1px solid rgba(255,255,255,.07);padding:0 24px;display:flex;gap:2px;flex-shrink:0}
.tab-btn{padding:12px 16px;font-size:13px;font-weight:500;color:var(--n400);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none}
.tab-btn.active{color:var(--g300);border-bottom-color:var(--g400)}
.tab-btn:hover:not(.active){color:var(--n200)}
.tab-content{flex:1;overflow-y:auto;padding:24px}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ── INFORME TAB ── */
.informe-wrap{max-width:900px;margin:0 auto}
.proj-info-card{background:var(--n800);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-lg);padding:20px;margin-bottom:20px}
.proj-info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.info-field{display:flex;flex-direction:column;gap:3px}
.info-field label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--n500)}
.info-field span{font-size:13px;color:var(--n100);font-weight:500}
.section-block{margin-bottom:20px}
.section-hdr{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.04);border-radius:var(--r);margin-bottom:8px;cursor:pointer;user-select:none}
.section-hdr:hover{background:rgba(255,255,255,.07)}
.section-icon{font-size:16px}
.section-name{font-size:13px;font-weight:600;color:white;flex:1}
.section-stats{display:flex;gap:8px}
.sec-stat{font-size:10px;padding:2px 8px;border-radius:999px}
.sec-stat.malo{background:rgba(239,68,68,.15);color:#fca5a5}
.sec-stat.ausente{background:rgba(139,92,246,.15);color:#c4b5fd}
.sec-stat.ok{background:rgba(34,164,74,.12);color:var(--g200)}
.section-chev{font-size:10px;color:var(--n500);transition:transform .2s}
.section-chev.open{transform:rotate(180deg)}
.items-list{display:flex;flex-direction:column;gap:6px}
.item-row{background:var(--n800);border:1px solid rgba(255,255,255,.06);border-radius:var(--r);overflow:hidden}
.item-row.crit{border-color:rgba(239,68,68,.3)}
.item-row.absent{border-color:rgba(139,92,246,.3)}
.item-hd{display:flex;align-items:center;padding:11px 14px;gap:10px;cursor:pointer}
.item-hd:hover{background:rgba(255,255,255,.03)}
.cond-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cond-dot.good{background:var(--g400)}
.cond-dot.regular{background:var(--amber)}
.cond-dot.bad{background:var(--red)}
.cond-dot.absent{background:var(--purple)}
.cond-dot.none{background:var(--n600)}
.item-name-wrap{flex:1;min-width:0}
.item-name{font-size:13px;font-weight:500;color:var(--n100)}
.item-ntc{font-size:10px;color:var(--n500);font-family:var(--mono)}
.item-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cond-pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px}
.cond-pill.good{background:rgba(34,164,74,.15);color:var(--g200)}
.cond-pill.regular{background:rgba(245,158,11,.15);color:#fcd34d}
.cond-pill.bad{background:rgba(239,68,68,.15);color:#fca5a5}
.cond-pill.absent{background:rgba(139,92,246,.15);color:#c4b5fd}
.cond-pill.none{background:rgba(255,255,255,.06);color:var(--n400)}
.ph-count{font-size:10px;color:var(--n500);font-family:var(--mono)}
.item-chev{font-size:10px;color:var(--n600);transition:transform .2s}
.item-chev.open{transform:rotate(180deg)}
.item-body{display:none;border-top:1px solid rgba(255,255,255,.05);padding:14px}
.item-body.open{display:block}
.fields-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.field-item{display:flex;flex-direction:column;gap:3px}
.field-item label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--n500)}
.field-item span{font-size:12px;color:var(--n200)}
.obs-block{grid-column:1/-1;background:rgba(255,255,255,.03);border-radius:var(--r);padding:10px;border-left:2px solid var(--n600)}
.obs-block label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--n500);display:block;margin-bottom:4px}
.obs-block p{font-size:12px;color:var(--n300);line-height:1.5}
.photos-section{margin-top:10px}
.photos-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--n500);margin-bottom:8px}
.photos-grid{display:flex;flex-wrap:wrap;gap:8px}
.photo-thumb{width:90px;height:70px;border-radius:var(--r);object-fit:cover;cursor:pointer;border:1px solid rgba(255,255,255,.08);transition:all .2s}
.photo-thumb:hover{transform:scale(1.05);border-color:var(--g400)}
.no-photos{font-size:11px;color:var(--n600);font-style:italic}

/* ── DECISIONES TAB ── */
.decisiones-wrap{max-width:900px;margin:0 auto}
.tierra-alert{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px}
.tierra-alert-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.tierra-alert-text h4{font-size:13px;font-weight:600;color:#fcd34d;margin-bottom:4px}
.tierra-alert-text p{font-size:12px;color:#fbbf24;line-height:1.5}
.pkg-decision{background:var(--n800);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden}
.pkg-dec-hdr{display:flex;align-items:center;padding:14px 18px;gap:12px;cursor:pointer;user-select:none}
.pkg-dec-hdr:hover{background:rgba(255,255,255,.03)}
.pkg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pkg-dec-title{font-size:14px;font-weight:600;color:white;flex:1}
.pkg-items-preview{font-size:11px;color:var(--n500)}
.pkg-dec-status{font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px}
.pkg-dec-status.sin{background:rgba(255,255,255,.06);color:var(--n400)}
.pkg-dec-status.nuevo{background:rgba(59,130,246,.15);color:#93c5fd}
.pkg-dec-status.segunda{background:rgba(245,158,11,.15);color:#fcd34d}
.pkg-dec-status.mant{background:rgba(34,164,74,.15);color:var(--g200)}
.pkg-dec-status.na{background:rgba(255,255,255,.06);color:var(--n500)}
.pkg-chev{font-size:10px;color:var(--n600);transition:transform .2s}
.pkg-chev.open{transform:rotate(180deg)}
.pkg-dec-body{display:none;border-top:1px solid rgba(255,255,255,.06);padding:16px 18px}
.pkg-dec-body.open{display:block}
.pkg-context{font-size:12px;color:var(--n400);margin-bottom:14px;line-height:1.5;padding:10px 12px;background:rgba(255,255,255,.03);border-radius:var(--r);border-left:2px solid var(--n600)}
.pkg-items-detail{margin-bottom:16px}
.pkg-items-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--n500);margin-bottom:8px}
.pkg-item-line{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.pkg-item-line:last-child{border-bottom:none}
.pkg-item-id{font-family:var(--mono);font-size:10px;color:var(--n500);width:50px;flex-shrink:0}
.pkg-item-name{font-size:12px;color:var(--n300);flex:1}
.pkg-item-cond{font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px}
.decision-form{border-top:1px solid rgba(255,255,255,.06);padding-top:14px}
.dec-form-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--n500);margin-bottom:10px}
.dec-options{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.dec-opt{padding:8px 14px;border-radius:var(--r);border:1.5px solid rgba(255,255,255,.1);background:transparent;color:var(--n400);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--font)}
.dec-opt:hover{border-color:rgba(255,255,255,.25);color:var(--n200)}
.dec-opt.selected.nuevo{border-color:#3b82f6;background:rgba(59,130,246,.15);color:#93c5fd}
.dec-opt.selected.segunda{border-color:var(--amber);background:rgba(245,158,11,.15);color:#fcd34d}
.dec-opt.selected.mant{border-color:var(--g400);background:rgba(34,164,74,.15);color:var(--g200)}
.dec-opt.selected.na{border-color:var(--n500);background:rgba(255,255,255,.06);color:var(--n300)}
.dec-obs textarea{width:100%;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--n100);font-family:var(--font);resize:vertical;min-height:70px;transition:border-color .2s}
.dec-obs textarea:focus{outline:none;border-color:var(--g400);background:rgba(255,255,255,.06)}
.dec-obs label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--n500);display:block;margin-bottom:6px}
.btn-save-pkg{background:var(--g600);color:white;border-radius:var(--r);padding:9px 18px;font-size:12px;font-weight:600;margin-top:12px;transition:all .2s}
.btn-save-pkg:hover{background:var(--g500)}
.btn-save-pkg:disabled{background:var(--n700);color:var(--n500);cursor:not-allowed}
.save-ok{font-size:11px;color:var(--g300);margin-left:10px;opacity:0;transition:opacity .3s}
.save-ok.show{opacity:1}
.traccion-note{background:rgba(34,164,74,.08);border:1px solid rgba(34,164,74,.2);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--g200);line-height:1.5}

/* ── LIGHTBOX ── */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:flex;align-items:center;justify-content:center;display:none}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:var(--r-lg);object-fit:contain}
.lightbox-close{position:absolute;top:20px;right:24px;background:rgba(255,255,255,.1);border:none;color:white;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ── LOADING / EMPTY ── */
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--n500);font-size:13px;gap:8px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--g400);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:48px 24px;color:var(--n500)}
.empty h3{font-size:16px;color:var(--n400);margin-bottom:6px}
.empty p{font-size:13px}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--n700);color:white;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;z-index:999;border:1px solid rgba(255,255,255,.1)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:600px){
  .proj-info-grid{grid-template-columns:1fr 1fr}
  .fields-grid{grid-template-columns:1fr}
  .stats-row{flex-wrap:wrap}
  .dec-options{gap:6px}
}
/* Hide number input spinner arrows */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
input[type=number] { -moz-appearance:textfield; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M12 2L4 7v10l8 5 8-5V7L12 2zm0 2.3l6 3.7v8l-6 3.7L6 16V8l6-3.7z"/></svg>
      </div>
      <div>
        <div class="brand-name">Greenergy <span class="brand-sub">Ascensores</span></div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn-refresh" onclick="refreshData()">↻ Actualizar</button>
    </div>
  </div>
  <div class="content">
    <!-- LIST SCREEN -->
    <div class="screen active" id="screen-list">
      <div class="list-wrap">
        <div class="list-hdr">
          <h1>Proyectos de modernización</h1>
        </div>
        <div class="stats-row" id="stats-row">
          <div class="stat"><div class="stat-val" id="stat-total">—</div><div class="stat-lbl">Proyectos</div></div>
          <div class="stat"><div class="stat-val" id="stat-pending">—</div><div class="stat-lbl">Decisiones pendientes</div></div>
          <div class="stat"><div class="stat-val" id="stat-hallazgos">—</div><div class="stat-lbl">Hallazgos críticos</div></div>
          <div class="stat"><div class="stat-val" id="stat-fotos">—</div><div class="stat-lbl">Fotos pendientes</div></div>
        </div>
        <div id="projects-container">
          <div class="loading"><div class="spinner"></div> Cargando proyectos...</div>
        </div>
      </div>
    </div>

    <!-- DETAIL SCREEN -->
    <div class="screen" id="screen-detail">
      <div class="detail-wrap">
        <div class="detail-topbar">
          <button class="btn-back" onclick="goBack()">← Volver</button>
          <div class="detail-title" id="detail-title">—</div>
          <div class="detail-code" id="detail-code">—</div>
        </div>
        <div class="detail-body">
          <div class="tabs-row">
            <button class="tab-btn active" onclick="switchTab('informe',this)">📋 Informe técnico</button>
            <button class="tab-btn" onclick="switchTab('decisiones',this)">⚖️ Decisiones comerciales</button>
            <button class="tab-btn" onclick="switchTab('cotizacion',this)">💰 Cotización</button>
            <button class="tab-btn" onclick="switchTab('cronograma',this)">📅 Cronograma</button>
          </div>
          <div class="tab-content">
            <div class="tab-pane active" id="tab-informe">
              <div class="loading"><div class="spinner"></div> Cargando informe...</div>
            </div>
            <div class="tab-pane" id="tab-decisiones">
              <div class="loading"><div class="spinner"></div> Cargando decisiones...</div>
            </div>
            <div class="tab-pane" id="tab-cotizacion">
              <div class="loading"><div class="spinner"></div> Cargando...</div>
            </div>
            <div class="tab-pane" id="tab-cronograma">
              <div class="loading"><div class="spinner"></div> Cargando...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
let AT_TOKEN = localStorage.getItem('grn_at_token') || '';
const BASE_ID  = 'app6WpUGWDLbyvl7k';
const TBL_PROYECTOS  = 'tblVly4txK2GjYBid';
const TBL_ITEMS      = 'tblbmQwbOLVtNqLFR';
const TBL_FOTOS      = 'tblZ2TgL2MrIspuNO';
const TBL_DECISIONES = 'tblRk1gJ5CadgsiOC';
const TBL_CATALOGO   = 'tblT7iHQzSLNWPscB';

const AT = (tbl, params='') =>
  fetch(`https://api.airtable.com/v0/${BASE_ID}/${tbl}${params}`, {
    headers:{ Authorization:`Bearer ${AT_TOKEN}` }
  }).then(r=>r.json());

const AT_POST = (tbl, body) =>
  fetch(`https://api.airtable.com/v0/${BASE_ID}/${tbl}`, {
    method:'POST',
    headers:{ Authorization:`Bearer ${AT_TOKEN}`, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  }).then(r=>r.json());

const AT_PATCH = (tbl, id, fields) =>
  fetch(`https://api.airtable.com/v0/${BASE_ID}/${tbl}/${id}`, {
    method:'PATCH',
    headers:{ Authorization:`Bearer ${AT_TOKEN}`, 'Content-Type':'application/json' },
    body: JSON.stringify({ fields })
  }).then(r=>r.json());

// ─── STATE ────────────────────────────────────────────────────────────────────
let allProyectos = [];
let allItems     = [];
let allFotos     = [];
let allDecisiones= [];
let allCatalogo  = [];
let curProyecto  = null;
let decisionState= {}; // { pkgKey: { decision, obs, airtableId } }
let needsTierraGlobal = false;
let _diasMaxCrono = 0; // last computed diasMax, for fecha restore after re-render

// ─── SECTIONS ─────────────────────────────────────────────────────────────────
const SECCIONES = [
  { key:'cm', label:'Cuarto de máquinas', icon:'⚙️' },
  { key:'tc', label:'Techo de cabina',    icon:'🔧' },
  { key:'re', label:'Recorrido / hueco',  icon:'↕️' },
  { key:'fo', label:'Foso',               icon:'⬇️' },
  { key:'ca', label:'Cabina',             icon:'🚪' },
  { key:'pu', label:'Puertas de hall',    icon:'🚪' },
];

const PAQUETES = [
  { key:'PKG1', label:'Paquete 1 — Máquina de tracción', color:'#1a853b',
    desc:'Cambio de máquina de tracción. Cables, terminales y poleas de desvío se incluyen según tracción.',
    items11:['cm01','cm02','cm03','tc12','re11'],
    items21:['cm01','cm02','cm03','cm13','cm14','tc13','re12'],
    nota11:'Tracción 1:1 — Terminales en techo de cabina y contrapeso.',
    nota21:'Tracción 2:1 — Terminales anclados en piso del cuarto de máquinas. Poleas de desvío en techo de cabina y contrapeso.' },
  { key:'PKG2', label:'Paquete 2 — Control electrónico', color:'#3b82f6',
    desc:'Control, encoder y caja de inspección siempre juntos. Cable viajero se incluye si su estado no es Bueno.',
    items:['cm04','cm08','tc01','re06'] },
  { key:'PKG3', label:'Paquete 3 — Puertas', color:'#f59e0b',
    desc:'Sistema de puertas completo. Se puede cotizar por sub-paquete según necesidad.',
    subpkgs:[
      { key:'PKG3A', label:'3A — Operador de cabina',
        desc:'Operador integrado (FERMATOR, SELCOM, etc.) — incluye motor + variador + mecanismo + biestables + banda infrarroja + gate switch.',
        items:['tc02','tc03','tc04','tc05','tc06'] },
      { key:'PKG3B', label:'3B — Puertas de cabina',
        desc:'Cambio de hojas de puertas de cabina. Se puede cotizar sin remodelación completa de cabina.',
        items:[] },
      { key:'PKG3C', label:'3C — Puertas de hall',
        desc:'Hojas, zapatas, llavín, operador, cerraduras y cableado de hall. Marcos y umbral solo si están dañados.',
        items:['pu01','pu02','pu03','pu04','pu05','re08','pu08'] },
    ]},
  { key:'PKG4', label:'Paquete 4 — Seguridades', color:'#8b5cf6',
    desc:'Limitador, paracaídas, buffers y cableado de seguridades del hueco.',
    items:['cm05','tc11','fo04','fo05','fo06','fo03'] },
  { key:'PKG5', label:'Paquete 5 — Cabina', color:'#0d4f6e',
    desc:'Modernización de cabina interior. Se puede cotizar remodelación y señalización por separado.',
    subpkgs:[
      { key:'PKG5A', label:'5A — Remodelación',
        desc:'Piso, techo interior, enchape/paredes, pasamanos, espejo e iluminación/ventilación.',
        items:['ca07','ca08','ca09','ca10','ca11','ca12'] },
      { key:'PKG5B', label:'5B — Señalización',
        desc:'Botoneras de cabina, indicador de posición, citófono, alarma, luz de emergencia, botoneras e indicadores de hall.',
        items:['ca01','ca02','ca03','ca04','ca05','ca06','pu06','pu07'] },
    ]},
  { key:'PKG6', label:'Paquete 6 — Zapatas y contrapeso', color:'#64748b',
    desc:'Zapatas de cabina y contrapeso, contrapeso. Para guías se ofrece realineación, no cambio.',
    items:['re01','re02','re03','re04','re05'] },
  { key:'PKG7', label:'Paquete 7 — Ítems independientes', color:'#334155',
    desc:'Ítems que se cotizan de forma independiente según estado registrado en el formulario.',
    items:['cm06','cm07','cm09','cm10','cm11','cm12','tc07','tc08','tc09','tc10','fo01','fo02','fo07','fo08','fo09','fo10','fo11','re07','re09','re10'] },
];

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  await loadAll();
  renderList();
}

async function loadAll(){
  try {
    const [pRes, iRes, fRes, dRes, cRes] = await Promise.all([
      fetchAll(TBL_PROYECTOS),
      fetchAll(TBL_ITEMS),
      fetchAll(TBL_FOTOS),
      fetchAll(TBL_DECISIONES),
      fetchAll(TBL_CATALOGO),
    ]);
    allProyectos  = pRes;
    allItems      = iRes;
    allFotos      = fRes;
    allDecisiones = dRes;
    allCatalogo   = cRes;
  } catch(e){
    console.error(e);
    toast('Error al conectar con Airtable');
  }
}

async function fetchAll(tbl){
  let records = [], offset = null;
  do {
    const params = offset ? `?offset=${offset}` : '';
    const res = await AT(tbl, params);
    if(res.records) records = records.concat(res.records);
    offset = res.offset || null;
  } while(offset);
  return records;
}

async function refreshData(){
  toast('Actualizando datos...');
  await loadAll();
  if(curProyecto){
    renderDetail(curProyecto);
  } else {
    renderList();
  }
  toast('Datos actualizados ✓');
}

// ─── LIST ──────────────────────────────────────────────────────────────────────
function renderList(){
  const container = document.getElementById('projects-container');
  if(!allProyectos.length){
    container.innerHTML = `<div class="empty"><h3>Sin proyectos</h3><p>No se encontraron proyectos en Airtable.</p></div>`;
    return;
  }

  // Stats
  let totalHallazgos = 0, totalFotosPend = 0, totalPending = 0;
  allProyectos.forEach(p => {
    const pid = p.id;
    const items = allItems.filter(i => {
      const pLink = i.fields['Proyecto'];
      return Array.isArray(pLink) && pLink.includes(pid);
    });
    items.forEach(it => {
      const c = it.fields['Condición'];
      if(c === 'bad' || c === 'Malo') totalHallazgos++;
      if(c === 'absent' || c === 'Ausente') totalHallazgos++;
      const req = it.fields['N.° fotos requeridas'] || 0;
      const done = it.fields['N.° fotos cargadas'] || 0;
      totalFotosPend += Math.max(0, req - done);
    });
    const decs = allDecisiones.filter(d => {
      const pLink = d.fields['Proyectos'];
      return Array.isArray(pLink) && pLink.includes(pid);
    });
    if(!decs.length) totalPending++;
  });

  document.getElementById('stat-total').textContent = allProyectos.length;
  document.getElementById('stat-pending').textContent = totalPending;
  document.getElementById('stat-hallazgos').textContent = totalHallazgos;
  document.getElementById('stat-fotos').textContent = totalFotosPend;

  const sorted = [...allProyectos].sort((a,b) => {
    const fa = a.fields['Fecha visita'] || a.fields['Fecha'] || '';
    const fb = b.fields['Fecha visita'] || b.fields['Fecha'] || '';
    return fb.localeCompare(fa);
  });

  let html = '<div class="projects-grid">';
  sorted.forEach(p => { html += renderProjCard(p); });
  html += '</div>';
  container.innerHTML = html;
}

function renderProjCard(p){
  const f = p.fields;
  const pid = p.id;
  const items = allItems.filter(i => {
    const pLink = i.fields['Proyecto'];
    return Array.isArray(pLink) && pLink.includes(pid);
  });
  const total = items.length;
  const done  = items.filter(i => i.fields['Condición'] && i.fields['Condición'] !== '').length;
  const malo  = items.filter(i => i.fields['Condición'] === 'bad' || i.fields['Condición'] === 'Malo').length;
  const aus   = items.filter(i => i.fields['Condición'] === 'absent' || i.fields['Condición'] === 'Ausente').length;
  const fotosPend = items.reduce((s,i) => s + Math.max(0,(i.fields['N.° fotos requeridas']||0)-(i.fields['N.° fotos cargadas']||0)), 0);
  const pct = total ? Math.round(done/total*100) : 0;

  const decs = allDecisiones.filter(d => {
    const pLink = d.fields['Proyectos'];
    return Array.isArray(pLink) && pLink.includes(pid);
  });
  const decStatus = !decs.length ? 'pendiente' : decs.length < PAQUETES.length ? 'en-proceso' : 'completo';
  const decLabel  = decStatus === 'pendiente' ? 'Sin decisiones' : decStatus === 'en-proceso' ? 'En proceso' : 'Completo';

  const codigo  = f['Código proyecto'] || f['codigo'] || '—';
  const cliente = f['Cliente'] || '—';
  const torre   = f['Torre / Bloque'] || f['torre'] || '';
  const asc     = f['Ascensor'] || f['ascensor'] || '';
  const tecnico = f['Técnico'] || f['tecnico'] || '—';
  const fecha   = f['Fecha visita'] || f['fecha'] || '—';

  return `<div class="proj-card" onclick="openProject('${p.id}')">
    <div class="proj-card-top">
      <span class="proj-code">${codigo}</span>
      <span class="dec-badge ${decStatus}">${decLabel}</span>
    </div>
    <div class="proj-name">${cliente}</div>
    <div class="proj-sub">${[torre, asc].filter(Boolean).join(' · ')}</div>
    <div class="proj-meta">
      <div class="proj-meta-item">👤 <span>${tecnico}</span></div>
      <div class="proj-meta-item">📅 <span>${fecha}</span></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label"><span>Formulario completo</span><span>${pct}%</span></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="hallazgos-row">
      ${malo  ? `<span class="hallazgo-chip h-malo">● ${malo} malo${malo>1?'s':''}</span>` : ''}
      ${aus   ? `<span class="hallazgo-chip h-ausente">● ${aus} ausente${aus>1?'s':''}</span>` : ''}
      ${fotosPend ? `<span class="hallazgo-chip h-fotos">📷 ${fotosPend} foto${fotosPend>1?'s':''} pend.</span>` : ''}
    </div>
  </div>`;
}

// ─── DETAIL ───────────────────────────────────────────────────────────────────
function openProject(pid){
  curProyecto = allProyectos.find(p => p.id === pid);
  if(!curProyecto) return;
  document.getElementById('screen-list').classList.remove('active');
  document.getElementById('screen-detail').classList.add('active');
  renderDetail(curProyecto);
  switchTab('informe', document.querySelector('.tab-btn'));
}

function goBack(){
  curProyecto = null;
  document.getElementById('screen-detail').classList.remove('active');
  document.getElementById('screen-list').classList.add('active');
}

function switchTab(name, btn){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name === 'cotizacion' && curProyecto) renderCotizacion(curProyecto);
  if(name === 'cronograma' && curProyecto) renderCronograma(curProyecto);
}

function renderDetail(p){
  const f = p.fields;
  const cliente = f['Cliente'] || '—';
  const torre   = f['Torre / Bloque'] || f['torre'] || '';
  const asc     = f['Ascensor'] || f['ascensor'] || '';
  const codigo  = f['Código proyecto'] || f['codigo'] || '—';

  document.getElementById('detail-title').textContent = `${cliente}${torre?' — '+torre:''}${asc?' · '+asc:''}`;
  document.getElementById('detail-code').textContent  = codigo;

  renderInforme(p);
  renderDecisiones(p);
}

// ─── INFORME ──────────────────────────────────────────────────────────────────
function renderInforme(p){
  const pid = p.id;
  const f   = p.fields;
  const items = allItems.filter(i => {
    const pLink = i.fields['Proyecto'];
    return Array.isArray(pLink) && pLink.includes(pid);
  });
  const fotos = allFotos.filter(ft => {
    const pLink = ft.fields['Proyecto'];
    return Array.isArray(pLink) && pLink.includes(pid);
  });

  const cliente  = f['Cliente'] || '—';
  const dir      = f['Dirección'] || f['dir'] || '—';
  const torre    = f['Torre / Bloque'] || f['torre'] || '—';
  const asc      = f['Ascensor'] || f['ascensor'] || '—';
  const tecnico  = f['Técnico'] || f['tecnico'] || '—';
  const fecha    = f['Fecha visita'] || f['fecha'] || '—';
  const marca    = f['Marca original'] || f['marca'] || '—';
  const paradas  = f['N.° paradas'] || f['paradas'] || '—';
  const cap      = f['Capacidad (kg)'] || f['cap'] || '—';
  const vel      = f['Velocidad (m/s)'] || f['vel'] || '—';
  const traccion = f['Tracción'] || f['traccion'] || '—';
  const tension  = f['Tensión'] || f['tension'] || '—';
  const puertas  = f['Puertas'] || f['puertas'] || '—';

  let html = `<div class="informe-wrap">
    <div class="proj-info-card">
      <div class="proj-info-grid">
        <div class="info-field"><label>Cliente / Edificio</label><span>${cliente}</span></div>
        <div class="info-field"><label>Dirección</label><span>${dir}</span></div>
        <div class="info-field"><label>Torre / Bloque</label><span>${torre}</span></div>
        <div class="info-field"><label>Ascensor</label><span>${asc}</span></div>
        <div class="info-field"><label>Técnico</label><span>${tecnico}</span></div>
        <div class="info-field"><label>Fecha visita</label><span>${fecha}</span></div>
        <div class="info-field"><label>Marca original</label><span>${marca}</span></div>
        <div class="info-field"><label>Paradas</label><span>${paradas}</span></div>
        <div class="info-field"><label>Capacidad</label><span>${cap} kg</span></div>
        <div class="info-field"><label>Velocidad</label><span>${vel} m/s</span></div>
        <div class="info-field"><label>Tracción</label><span>${traccion}</span></div>
        <div class="info-field"><label>Tensión</label><span>${tension}</span></div>
        <div class="info-field"><label>Tipo puertas</label><span>${puertas}</span></div>
      </div>
    </div>`;

  SECCIONES.forEach(sec => {
    const secItems = items.filter(i => {
      const itemId = i.fields['ID ítem'] || '';
      const raw = itemId.includes('_') ? itemId.split('_')[1] : itemId;
      return raw.startsWith(sec.key);
    }).sort((a,b) => {
      const ra = (a.fields['ID ítem']||'').split('_').pop();
      const rb = (b.fields['ID ítem']||'').split('_').pop();
      return ra.localeCompare(rb, undefined, {numeric:true});
    });
    if(!secItems.length) return;

    const malo = secItems.filter(i => i.fields['Condición'] === 'bad' || i.fields['Condición'] === 'Malo').length;
    const aus  = secItems.filter(i => i.fields['Condición'] === 'absent' || i.fields['Condición'] === 'Ausente').length;
    const ok   = secItems.filter(i => i.fields['Condición'] === 'good' || i.fields['Condición'] === 'Bueno').length;

    const secId = `sec-${sec.key}-${pid.slice(-4)}`;
    html += `<div class="section-block">
      <div class="section-hdr" onclick="togSection('${secId}')">
        <span class="section-icon">${sec.icon}</span>
        <span class="section-name">${sec.label}</span>
        <div class="section-stats">
          ${malo ? `<span class="sec-stat malo">${malo} malo${malo>1?'s':''}</span>` : ''}
          ${aus  ? `<span class="sec-stat ausente">${aus} ausente${aus>1?'s':''}</span>` : ''}
          ${ok   ? `<span class="sec-stat ok">${ok} bueno${ok>1?'s':''}</span>` : ''}
        </div>
        <span class="section-chev" id="chev-${secId}">▼</span>
      </div>
      <div class="items-list" id="${secId}" style="display:none;padding-left:16px">`;

    secItems.forEach(it => {
      const iid   = it.id;
      const ifields = it.fields;
      const nombre = ifields['Nombre del ítem'] || '—';
      const ntc    = ifields['NTC referencia'] || '';
      const cond   = normCond(ifields['Condición']);
      const condLabel = condText(cond);
      const campos = parseCampos(ifields['Campos técnicos']);
      const obs    = campos['_obs'] || '';
      const itemFotos = fotos.filter(ft => {
        const link = ft.fields['Ítem'];
        return Array.isArray(link) && link.includes(iid);
      });
      const fotosReq  = ifields['N.° fotos requeridas'] || 0;
      const fotosDone = ifields['N.° fotos cargadas'] || 0;

      const rowCls = cond === 'bad' ? 'item-row crit' : cond === 'absent' ? 'item-row absent' : 'item-row';
      const bodyId = `itbody-${iid}`;

      html += `<div class="${rowCls}">
        <div class="item-hd" onclick="togItem('${bodyId}')">
          <div class="cond-dot ${cond||'none'}"></div>
          <div class="item-name-wrap">
            <div class="item-name">${nombre}</div>
            ${ntc ? `<div class="item-ntc">${ntc}</div>` : ''}
          </div>
          <div class="item-right">
            <span class="cond-pill ${cond||'none'}">${condLabel}</span>
            <span class="ph-count">${fotosDone}/${fotosReq} 📷</span>
            <span class="item-chev" id="chev-${bodyId}">▼</span>
          </div>
        </div>
        <div class="item-body" id="${bodyId}">
          <div class="fields-grid">`;

      Object.entries(campos).forEach(([k,v]) => {
        if(k === '_obs') return;
        html += `<div class="field-item"><label>${k}</label><span>${v || '—'}</span></div>`;
      });

      if(obs){
        html += `<div class="obs-block"><label>Observaciones</label><p>${obs}</p></div>`;
      }

      html += `</div>`;

      if(itemFotos.length){
        html += `<div class="photos-section"><div class="photos-lbl">Fotos (${itemFotos.length})</div><div class="photos-grid">`;
        itemFotos.forEach(ft => {
          const arch = ft.fields['Archivo'];
          const label = ft.fields['Nombre requerido'] || '';
          if(arch && Array.isArray(arch) && arch[0]){
            html += `<img class="photo-thumb" src="${arch[0].url}" alt="${label}" title="${label}" onclick="openLightbox('${arch[0].url}')">`;
          }
        });
        html += `</div></div>`;
      } else {
        html += `<div class="photos-section"><div class="no-photos">Sin fotos cargadas</div></div>`;
      }

      html += `</div></div>`;
    });

    html += `</div></div>`;
  });

  html += '</div>';
  document.getElementById('tab-informe').innerHTML = html;
}

// ─── DECISIONES ───────────────────────────────────────────────────────────────
const DEC_OPTS = ['Vender Nuevo','Vender de Segunda','Vender Mantenimiento','Pendiente por definir','No aplica'];

function getItemDecKey(pid, pkgKey, itemId){ return `${pid.slice(-6)}_${pkgKey}_${itemId}`; }

function renderDecisiones(p){
  const pid = p.id;
  const f   = p.fields;
  const traccion = (f['Tracción'] || f['traccion'] || '').toLowerCase();
  const is21 = traccion.includes('2:1');
  const items = allItems.filter(i => {
    const pLink = i.fields['Proyecto'];
    return Array.isArray(pLink) && pLink.includes(pid);
  });

  // Build decisionState from existing records (keyed by ID decisión)
  decisionState = {};
  allDecisiones.filter(d => {
    const pLink = d.fields['Proyectos'];
    return Array.isArray(pLink) && pLink.includes(pid);
  }).forEach(d => {
    const key = d.fields['ID decisión'] || '';
    decisionState[key] = {
      decision: d.fields['Decisión'] || '',
      obs: d.fields['Observaciones'] || '',
      airtableId: d.id
    };
  });

  // Check tierra
  const cm06 = items.find(i => {
    const iid = i.fields['ID ítem'] || '';
    const raw = iid.includes('_') ? iid.split('_')[1] : iid;
    return raw === 'cm06';
  });
  const campos06 = cm06 ? parseCampos(cm06.fields['Campos técnicos']) : {};
  const tierra = (campos06['Puesta a tierra'] || '').toLowerCase();
  const needsTierra = tierra === 'no' || tierra === 'parcial';
  needsTierraGlobal = needsTierra;

  let html = '<div class="decisiones-wrap">';

  if(needsTierra){
    html += `<div class="tierra-alert">
      <div class="tierra-alert-icon">⚠️</div>
      <div class="tierra-alert-text">
        <h4>Puesta a tierra deficiente — acción requerida del cliente</h4>
        <p>El informe registra puesta a tierra como <strong>${campos06['Puesta a tierra']}</strong>. El control NICE 3000 requiere resistencia de tierra ≤ 10 Ω. El cliente debe contratar un estudio y mejora de puesta a tierra antes del inicio de la modernización.</p>
      </div>
    </div>`;
  }

  // Helper to get all items from a pkg (including subpkgs)
  function getAllPkgItems(pkg){
    if(pkg.subpkgs) return pkg.subpkgs.flatMap(sp => getPkgItems(sp, is21, items));
    return getPkgItems(pkg, is21, items);
  }

  // Pre-init decisionState for all items so they show "Pendiente por definir"
  PAQUETES.forEach(pkg => {
    getAllPkgItems(pkg).forEach(it => {
      const iid = it.fields['ID ítem']||'';
      const raw = iid.includes('_')?iid.split('_')[1]:iid;
      const key = getItemDecKey(pid, pkg.key, raw);
      if(!decisionState[key]) decisionState[key]={decision:'Pendiente por definir',obs:'',airtableId:null};
    });
  });

  PAQUETES.forEach(pkg => {
    const allPkgItems = getAllPkgItems(pkg);
    const critCount = allPkgItems.filter(i=>{ const c=normCond(i.fields['Condición']); return c==='bad'||c==='absent'; }).length;
    const totalItems = allPkgItems.length;
    const decCount = allPkgItems.filter(it=>{
      const iid=it.fields['ID ítem']||''; const raw=iid.includes('_')?iid.split('_')[1]:iid;
      const d=decisionState[getItemDecKey(pid,pkg.key,raw)]?.decision||'';
      return d && d!=='Pendiente por definir';
    }).length;
    const pkgStatusLbl = totalItems===0?'Sin ítems':decCount===totalItems?'Completo':decCount>0?`${decCount}/${totalItems}`:'Sin definir';
    const pkgStatusCls = totalItems===0?'sin':decCount===totalItems?'mant':decCount>0?'segunda':'sin';
    const color = pkg.color||'#64748b';

    html += `<div class="pkg-decision">
      <div class="pkg-dec-hdr" onclick="togPkg('${pkg.key}')">
        <div class="pkg-dot" style="background:${color}"></div>
        <div class="pkg-dec-title">${pkg.label}</div>
        ${critCount?`<span class="pkg-items-preview">⚠ ${critCount} crítico${critCount>1?'s':''}</span>`:''}
        <span class="pkg-dec-status ${pkgStatusCls}" id="pkgstatus-${pkg.key}">${pkgStatusLbl}</span>
        <span class="pkg-chev" id="pkgchev-${pkg.key}">▼</span>
      </div>
      <div class="pkg-dec-body" id="pkgbody-${pkg.key}">
        <div class="pkg-context">${pkg.desc}</div>`;

    if(pkg.key==='PKG1') html += `<div class="traccion-note">Tracción: <strong>${f['Tracción']||f['traccion']||'No especificada'}</strong> — ${is21?pkg.nota21:pkg.nota11}</div>`;
    if(pkg.key==='PKG6') html += `<div class="traccion-note" style="border-color:rgba(100,116,139,.4)">⚠ Para guías (re01, re02) se ofrece <strong>realineación</strong>, no cambio.</div>`;

    if(pkg.subpkgs){
      pkg.subpkgs.forEach(sp => {
        const spItems = getPkgItems(sp, is21, items);
        html += `<div style="margin-bottom:14px">
          <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:${color};padding:8px 0 6px;border-bottom:1px solid rgba(255,255,255,.07)">${sp.label}</div>
          <div style="font-size:12px;color:var(--n500);padding:6px 0 8px;font-style:italic">${sp.desc}</div>`;
        html += renderItemRows(spItems, pid, pkg.key);
        html += `</div>`;
      });
    } else {
      html += renderItemRows(allPkgItems, pid, pkg.key);
    }

    html += `<div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)">
      <div class="dec-obs"><label>Observaciones del paquete</label>
        <textarea id="pkgobs-${pkg.key}" placeholder="Notas generales para este paquete..."></textarea>
      </div>
      <div style="display:flex;align-items:center;margin-top:8px">
        <button class="btn-save-pkg" onclick="savePkg('${pkg.key}','${pid}')">Guardar decisiones</button>
        <span class="save-ok" id="saveok-${pkg.key}">✓ Guardado</span>
      </div>
    </div>
    </div></div>`;
  });

  html += '</div>';
  document.getElementById('tab-decisiones').innerHTML = html;
}

function getPkgItems(pkg, is21, items){
  let ids = [];
  if(pkg.key === 'PKG1'){
    ids = is21 ? (pkg.items21 || []) : (pkg.items11 || []);
  } else {
    ids = Array.isArray(pkg.items) ? pkg.items : [];
  }
  return items.filter(i => {
    const iid = i.fields['ID ítem'] || '';
    const raw = iid.includes('_') ? iid.split('_')[1] : iid;
    return ids.includes(raw);
  }).sort((a,b) => {
    const ra = (a.fields['ID ítem']||'').split('_').pop();
    const rb = (b.fields['ID ítem']||'').split('_').pop();
    return ra.localeCompare(rb, undefined, {numeric:true});
  });
}

function renderItemRows(pkgItemsList, pid, pkgKey){
  if(!pkgItemsList.length) return '<div style="font-size:12px;color:var(--n500);padding:6px 0;font-style:italic">Sin ítems del formulario.</div>';
  let h = '<div class="pkg-items-detail">';
  pkgItemsList.forEach(it => {
    const nombre = it.fields['Nombre del ítem'] || '—';
    const iid = it.fields['ID ítem'] || '';
    const raw = iid.includes('_') ? iid.split('_')[1] : iid;
    const cond = normCond(it.fields['Condición']);
    const itemDecKey = getItemDecKey(pid, pkgKey, raw);
    const itemDec = decisionState[itemDecKey] || { decision:'Pendiente por definir', obs:'' };
    const decLabel = itemDec.decision || 'Pendiente por definir';
    const decCls = decLabel==='Vender Nuevo'?'nuevo':decLabel==='Vender de Segunda'?'segunda':decLabel==='Vender Mantenimiento'?'mant':decLabel==='No aplica'?'na':'';
    const dropId = `drop-${itemDecKey}`;
    h += `<div style="border-bottom:1px solid rgba(255,255,255,.05)">
      <div style="display:flex;align-items:center;gap:10px;padding:9px 4px;cursor:pointer" onclick="togItemDrop('${dropId}')">
        <span style="font-family:var(--mono);font-size:10px;color:var(--n500);width:44px;flex-shrink:0">${raw}</span>
        <span style="flex:1;font-size:13px;color:var(--n200)">${nombre}</span>
        <span class="cond-pill ${cond||'none'}" style="font-size:10px">${condText(cond)}</span>
        <span class="pkg-dec-status ${decCls}" id="badge-${itemDecKey}" style="font-size:10px;padding:2px 8px;white-space:nowrap;display:inline-block;min-width:90px;max-width:130px;overflow:hidden;text-overflow:ellipsis;text-align:center">${decLabel}</span>
        <span style="font-size:10px;color:var(--n600);flex-shrink:0;margin-left:4px">▼</span>
      </div>
      <div id="${dropId}" style="display:none;padding:8px 0 12px 54px">
        ${DEC_OPTS.map(opt => {
          const cls = opt==='Vender Nuevo'?'nuevo':opt==='Vender de Segunda'?'segunda':opt==='Vender Mantenimiento'?'mant':opt==='No aplica'?'na':'';
          const sel = itemDec.decision===opt?'selected':'';
          return `<div style="padding:3px 0"><button class="dec-opt ${cls} ${sel}" style="font-size:12px;padding:6px 14px;min-width:200px;text-align:left" onclick="selectItemDec('${itemDecKey}','${opt}',this,'${dropId}')">${opt}</button></div>`;
        }).join('')}
      </div>
    </div>`;
  });
  h += '</div>';
  return h;
}

function togItemDrop(dropId){
  const el = document.getElementById(dropId);
  if(!el) return;
  const isOpen = el.style.display !== 'none';
  document.querySelectorAll('[id^="drop-"]').forEach(d => { d.style.display='none'; });
  if(!isOpen) el.style.display = 'block';
}

function selectItemDec(itemDecKey, value, btn, dropId){
  if(!decisionState[itemDecKey]) decisionState[itemDecKey] = { decision:'Pendiente por definir', obs:'', airtableId:null };
  decisionState[itemDecKey].decision = value;
  // Update dropdown selected state
  document.getElementById(dropId).querySelectorAll('.dec-opt').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  // Update badge
  const clsMap = {'Vender Nuevo':'nuevo','Vender de Segunda':'segunda','Vender Mantenimiento':'mant','No aplica':'na'};
  const badge = document.getElementById('badge-'+itemDecKey);
  if(badge){
    badge.textContent = value;
    badge.className = `pkg-dec-status ${clsMap[value]||''}`;
    badge.style.cssText = 'font-size:10px;padding:2px 8px;white-space:nowrap;display:inline-block;min-width:90px;max-width:130px;overflow:hidden;text-overflow:ellipsis;text-align:center';
  }
  // Close dropdown
  document.getElementById(dropId).style.display = 'none';
  updatePkgProgress(itemDecKey);
}

function updatePkgProgress(itemDecKey){
  const parts = itemDecKey.split('_');
  if(parts.length < 2) return;
  const pkgKey = parts[1];
  const statusEl = document.getElementById(`pkgstatus-${pkgKey}`);
  if(!statusEl) return;
  const entries = Object.entries(decisionState).filter(([k]) => { const p=k.split('_'); return p.length>=3 && p[1]===pkgKey; });
  const total = entries.length;
  const done = entries.filter(([,v]) => v.decision && v.decision!=='Pendiente por definir').length;
  if(total===0) return;
  statusEl.textContent = done===total?'Completo':done>0?`${done}/${total}`:'Sin definir';
  statusEl.className = `pkg-dec-status ${done===total?'mant':done>0?'segunda':'sin'}`;
}

async function savePkg(pkgKey, pid){
  const obs = document.getElementById(`pkgobs-${pkgKey}`)?.value || '';
  // Get all entries for this package from decisionState
  const pkgEntries = Object.entries(decisionState).filter(([k]) => {
    // ID format: {pid6chars}_{PKGx}_{itemId}
    // pid6chars never contains underscore, PKGx never contains underscore
    const parts = k.split('_');
    return parts.length >= 3 && parts[1] === pkgKey;
  });
  if(!pkgEntries.length){ toast('Sin ítems que guardar'); return; }

  let saved = 0;
  for(const [key, st] of pkgEntries){
    const fields = {
      'ID decisión': key,
      'Paquete': pkgKey,
      'Decisión': st.decision || 'Pendiente por definir',
      'Observaciones': obs,
      'Proyectos': [pid],
      'Fecha decisión': new Date().toISOString().split('T')[0],
      'Requiere estudio tierra': needsTierraGlobal,
    };
    try {
      if(st.airtableId){
        await AT_PATCH(TBL_DECISIONES, st.airtableId, fields);
      } else {
        const res = await AT_POST(TBL_DECISIONES, { fields });
        if(res.id){
          decisionState[key].airtableId = res.id;
          allDecisiones.push(res);
        }
      }
      decisionState[key].obs = obs;
      saved++;
    } catch(e){ console.error(e); }
  }
  const okEl = document.getElementById(`saveok-${pkgKey}`);
  if(okEl){ okEl.classList.add('show'); setTimeout(()=>okEl.classList.remove('show'),2500); }
  toast(`${saved} decisión(es) guardada(s) ✓`);
}

// ─── COTIZACIÓN ───────────────────────────────────────────────────────────────
function renderCotizacion(p){
  const pid = p.id;
  const f   = p.fields;
  const paradas   = parseInt(f['Paradas'] || f['paradas'] || 0);
  const traccion  = (f['Tracción'] || f['traccion'] || '').toLowerCase();
  const is21      = traccion.includes('2:1');
  const items     = allItems.filter(i => Array.isArray(i.fields['Proyecto']) && i.fields['Proyecto'].includes(pid));

  // Get N° cables from cm03 item
  const cm03item  = items.find(i => { const r=(i.fields['ID ítem']||'').split('_').pop(); return r==='cm03'; });
  const nCables   = cm03item ? parseInt((parseCampos(cm03item.fields['Campos técnicos'])['N.° de cables'] || '0')) : 0;

  // Build decisions map: itemId → decision label
  const decsMap = {};
  allDecisiones.filter(d => Array.isArray(d.fields['Proyectos']) && d.fields['Proyectos'].includes(pid))
    .forEach(d => {
      const key = d.fields['ID decisión'] || '';
      const parts = key.split('_');
      if(parts.length >= 3){
        const itemId = parts.slice(2).join('_');
        decsMap[itemId] = d.fields['Decisión'] || '';
      }
    });

  // Build catalog map: "itemId_decision" → catalog record
  const catMap = {};
  allCatalogo.forEach(c => {
    const id = c.fields['ID catalogo'] || '';
    catMap[id] = c.fields;
  });

  function decToKey(dec){
    return dec.toLowerCase().replace(/ /g,'_');
  }

  function calcPrecio(itemId, dec){
    if(!dec || dec === 'Pendiente por definir' || dec === 'No aplica') return null;
    const catKey = `${itemId}_${decToKey(dec)}`;
    const cat = catMap[catKey];
    if(!cat) return null;
    const tipo    = cat['Tipo de cálculo'] || 'Fijo';
    const pventa  = cat['Precio venta COP'] || 0;
    if(pventa === 0) return null;

    if(tipo === 'Fijo') return pventa;
    if(tipo === '× paradas') return pventa * paradas;
    if(tipo === '× cables') return pventa * nCables;
    if(tipo === '× paradas × tracción × cables'){
      const mult = is21 ? 2 : 1;
      return pventa * paradas * mult * nCables;
    }
    return pventa;
  }

  // Calculate totals per package
  function getAllPkgItemIds(pkg){
    if(pkg.subpkgs) return pkg.subpkgs.flatMap(sp => sp.items||[]);
    return pkg.items || (pkg.items11 ? (is21 ? pkg.items21 : pkg.items11) : []);
  }

  let grandTotal = 0;
  let grandCosto = 0;
  const pkgTotals = [];

  PAQUETES.forEach(pkg => {
    const itemIds = getAllPkgItemIds(pkg);
    let pkgPrecio = 0;
    let pkgCosto  = 0;
    const itemRows = [];

    itemIds.forEach(itemId => {
      // Find decision for this item in this package
      const dec = decsMap[itemId] || '';
      const precio = calcPrecio(itemId, dec);
      const catKey = `${itemId}_${decToKey(dec)}`;
      const cat = catMap[catKey];
      const costo = cat ? (() => {
        const tipo = cat['Tipo de cálculo']||'Fijo';
        const ct = cat['Costo total COP']||0;
        if(tipo==='Fijo') return ct;
        if(tipo==='× paradas') return ct*paradas;
        if(tipo==='× cables') return ct*nCables;
        if(tipo==='× paradas × tracción × cables'){ const m=is21?2:1; return ct*paradas*m*nCables; }
        return ct;
      })() : 0;

      if(precio !== null){
        pkgPrecio += precio;
        pkgCosto  += costo;
        itemRows.push({ itemId, nombre: cat?.['Nombre ítem']||itemId, dec, precio, costo });
      }
    });

    if(pkgPrecio > 0){
      grandTotal += pkgPrecio;
      grandCosto += pkgCosto;
      pkgTotals.push({ pkg, pkgPrecio, pkgCosto, itemRows });
    }
  });

  const margenGlobal = grandTotal > 0 ? ((grandTotal - grandCosto) / grandTotal * 100).toFixed(1) : 0;
  const fmt = v => '$' + Math.round(v).toLocaleString('es-CO');

  let html = `<div style="max-width:800px;margin:0 auto;padding:8px 0">`;

  // Summary card
  html += `<div style="background:rgba(26,133,59,.08);border:1px solid rgba(26,133,59,.25);border-radius:12px;padding:20px 24px;margin-bottom:24px">
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--g400);margin-bottom:14px">Resumen de cotización</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
      <div>
        <div style="font-size:11px;color:var(--n500);margin-bottom:4px">Costo total Greenergy</div>
        <div style="font-size:20px;font-weight:700;color:var(--n100)">${fmt(grandCosto)}</div>
      </div>
      <div>
        <div style="font-size:11px;color:var(--n500);margin-bottom:4px">Precio de venta</div>
        <div style="font-size:20px;font-weight:700;color:var(--g300)">${fmt(grandTotal)}</div>
      </div>
      <div>
        <div style="font-size:11px;color:var(--n500);margin-bottom:4px">Margen promedio</div>
        <div style="font-size:20px;font-weight:700;color:${parseFloat(margenGlobal)>=35?'var(--g300)':'#f59e0b'}">${margenGlobal}%</div>
      </div>
    </div>
  </div>`;

  // Per package breakdown
  if(pkgTotals.length === 0){
    html += `<div style="text-align:center;padding:40px;color:var(--n500);font-size:13px">
      No hay ítems con precios definidos aún.<br>
      <span style="font-size:12px">Completa el catálogo de precios en Airtable para ver la cotización.</span>
    </div>`;
  } else {
    pkgTotals.forEach(({ pkg, pkgPrecio, pkgCosto, itemRows }) => {
      const pkgMargen = pkgPrecio > 0 ? ((pkgPrecio - pkgCosto) / pkgPrecio * 100).toFixed(1) : 0;
      const color = pkg.color || '#64748b';
      html += `<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;margin-bottom:12px;overflow:hidden">
        <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06)">
          <div style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0"></div>
          <div style="flex:1;font-size:13px;font-weight:600;color:var(--n100)">${pkg.label}</div>
          <div style="font-size:12px;color:var(--n400)">${pkgMargen}% margen</div>
          <div style="font-size:14px;font-weight:700;color:var(--g300)">${fmt(pkgPrecio)}</div>
        </div>`;

      itemRows.forEach(({ itemId, nombre, dec, precio, costo }) => {
        const decCls = dec==='Vender Nuevo'?'nuevo':dec==='Vender de Segunda'?'segunda':dec==='Vender Mantenimiento'?'mant':'';
        html += `<div style="display:flex;align-items:center;gap:10px;padding:8px 16px 8px 38px;border-bottom:1px solid rgba(255,255,255,.03)">
          <span style="font-family:var(--mono);font-size:10px;color:var(--n600);width:40px;flex-shrink:0">${itemId}</span>
          <span style="flex:1;font-size:12px;color:var(--n300)">${nombre}</span>
          <span class="pkg-dec-status ${decCls}" style="font-size:10px;padding:2px 7px">${dec}</span>
          <span style="font-size:12px;color:var(--n400);width:110px;text-align:right">${fmt(costo)}</span>
          <span style="font-size:12px;color:var(--n100);font-weight:600;width:110px;text-align:right">${fmt(precio)}</span>
        </div>`;
      });
      html += `</div>`;
    });
  }

  html += `<div style="font-size:11px;color:var(--n600);text-align:center;padding:16px 0">
    Los ítems con decisión "No aplica" o "Pendiente por definir" no se incluyen en el total.<br>
    Los ítems sin precio en el catálogo tampoco se incluyen.
  </div></div>`;

  document.getElementById('tab-cotizacion').innerHTML = html;
}

function renderCronograma(p){
  const pid = p.id;
  const f   = p.fields;
  const traccion = (f['Tracción']||f['traccion']||'').toLowerCase();
  const is21 = traccion.includes('2:1');

  // Get items with defined decisions for this project
  const decsMap = {};
  const decRecordMap = {}; // itemId → airtable record id (for saving priority)
  allDecisiones.filter(d => Array.isArray(d.fields['Proyectos']) && d.fields['Proyectos'].includes(pid))
    .forEach(d => {
      const key = d.fields['ID decisión']||'';
      const parts = key.split('_');
      if(parts.length >= 3){
        const itemId = parts.slice(2).join('_');
        const dec = d.fields['Decisión']||'';
        if(dec && dec !== 'Pendiente por definir' && dec !== 'No aplica'){
          decsMap[itemId] = { dec, prioridad: d.fields['Prioridad']||null, airtableId: d.id };
          decRecordMap[itemId] = d.id;
        }
      }
    });



  // Build list with hours per item
  const itemIds = Object.keys(decsMap);
  if(!itemIds.length){
    document.getElementById('tab-cronograma').innerHTML = `
      <div style="text-align:center;padding:40px;color:var(--color-text-secondary);font-size:13px">
        No hay decisiones definidas aún.<br>
        <span style="font-size:12px">Define las decisiones comerciales para generar el cronograma.</span>
      </div>`;
    return;
  }
  const itemsList = itemIds.map(id => {
    const db = TAREAS_DB[id];
    const info = decsMap[id];
    const dec = info.dec;
    const isMant = dec === 'Vender Mantenimiento';
    const hn = db ? (isMant ? db.hm : db.hn) : [1,2];
    const prio = info.prioridad != null ? info.prioridad : (DEFAULT_PRIO[id] || 99);
    return { id, dec, hn, prio, airtableId: info.airtableId,
             nombre: ITEM_NAMES[id]||id, zona: ITEM_ZONA[id.substring(0,2)]||'',
             note: db?.note||'', tareas: db?.t||[] };
  }).sort((a,b) => a.prio - b.prio || a.id.localeCompare(b.id));

  const totalMin = itemsList.reduce((s,r)=>s+r.hn[0],0);
  const totalMax = itemsList.reduce((s,r)=>s+r.hn[1],0);
  const diasMin = Math.ceil(totalMin/14);
  const diasMax = Math.ceil(totalMax/14);
  _diasMaxCrono = diasMax; // expose globally for post-render fecha restore

  // Group by zone for summary bars only
  const byZona = {};
  itemsList.forEach(it => {
    const z = it.zona || 'Otros';
    if(!byZona[z]) byZona[z] = [];
    byZona[z].push(it);
  });

async function savePrioridad(itemId, airtableId, value){
  const newPrio = parseInt(value);
  if(isNaN(newPrio) || newPrio < 1) return;

  const pid = curProyecto?.id;
  if(!pid) return;

  // All cronograma decision records for this project
  const relDecs = allDecisiones.filter(d => {
    if(!Array.isArray(d.fields['Proyectos']) || !d.fields['Proyectos'].includes(pid)) return false;
    const key = d.fields['ID decisión']||'';
    const parts = key.split('_');
    if(parts.length < 3) return false;
    const dec = d.fields['Decisión']||'';
    return dec && dec !== 'Pendiente por definir' && dec !== 'No aplica';
  });

  // Build ordered array using current priority values
  const ordered = relDecs.map(d => {
    const key = d.fields['ID decisión']||'';
    const iid = key.split('_').slice(2).join('_');
    const curPrio = d.fields['Prioridad'] != null ? d.fields['Prioridad'] : (DEFAULT_PRIO[iid]||99);
    return { rec: d, iid, curPrio };
  }).sort((a,b) => a.curPrio - b.curPrio || a.iid.localeCompare(b.iid));

  // Remove moved item and re-insert at target position (1-indexed → 0-indexed)
  const movedIdx = ordered.findIndex(x => x.rec.id === airtableId);
  if(movedIdx < 0) return;
  const [moved] = ordered.splice(movedIdx, 1);
  const insertAt = Math.max(0, Math.min(newPrio - 1, ordered.length));
  ordered.splice(insertAt, 0, moved);

  // Assign sequential priorities 1..N
  ordered.forEach((item, idx) => {
    item.rec.fields['Prioridad'] = idx + 1;
  });

  // Re-render immediately (reads from allDecisiones in memory), preserving fecha de inicio
  const fechaAntes = document.getElementById('crono-fecha-inicio')?.value || '';
  renderCronograma(curProyecto);
  if(fechaAntes){
    const inp = document.getElementById('crono-fecha-inicio');
    if(inp){ inp.value = fechaAntes; calcFechaFin(_diasMaxCrono); }
  }
  _updateGenerarBtn();

  // Persist all to Airtable
  const patches = ordered
    .filter(x => x.rec.id)
    .map(x => AT_PATCH(TBL_DECISIONES, x.rec.id, { 'Prioridad': x.rec.fields['Prioridad'] }).catch(()=>null));
  try {
    await Promise.all(patches);
    toast('Prioridades actualizadas ✓');
  } catch(e){
    toast('Error al guardar prioridad');
  }
}

async function resetPrioridades(){
  const pid = curProyecto?.id;
  if(!pid) return;

  const relDecs = allDecisiones.filter(d => {
    if(!Array.isArray(d.fields['Proyectos']) || !d.fields['Proyectos'].includes(pid)) return false;
    const key = d.fields['ID decisión']||'';
    const parts = key.split('_');
    if(parts.length < 3) return false;
    const dec = d.fields['Decisión']||'';
    return dec && dec !== 'Pendiente por definir' && dec !== 'No aplica';
  });

  const patches = relDecs.map(d => {
    const key = d.fields['ID decisión']||'';
    const iid = key.split('_').slice(2).join('_');
    const prio = DEFAULT_PRIO[iid] || 99;
    d.fields['Prioridad'] = prio;
    return AT_PATCH(TBL_DECISIONES, d.id, { 'Prioridad': prio }).catch(()=>null);
  });

  const fechaGuardada = document.getElementById('crono-fecha-inicio')?.value || '';
  renderCronograma(curProyecto);
  if(fechaGuardada){
    const inp = document.getElementById('crono-fecha-inicio');
    if(inp){ inp.value = fechaGuardada; calcFechaFin(_diasMaxCrono); }
  }
  _updateGenerarBtn();
  try {
    await Promise.all(patches);
    toast('Orden recomendado restablecido ✓');
  } catch(e){
    toast('Error al restablecer prioridades');
  }
}

function getFestivosColombia(year){
  // Fixed holidays
  const fixed = [
    `${year}-01-01`,`${year}-05-01`,`${year}-07-20`,`${year}-08-07`,`${year}-12-08`,`${year}-12-25`
  ];
  // Easter-based holidays (Semana Santa + Ascension etc)
  function easter(y){
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4;
    const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
    const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
    const m=Math.floor((a+11*h+22*l)/451);
    const month=Math.floor((h+l-7*m+114)/31);
    const day=((h+l-7*m+114)%31)+1;
    return new Date(y,month-1,day);
  }
  function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
  function toStr(d){ return d.toISOString().split('T')[0]; }
  // Next monday rule for some holidays
  function nextMonday(d){
    const day=d.getDay();
    if(day===1) return d;
    const diff = day===0 ? 1 : 8-day;
    return addDays(d,diff);
  }
  const e = easter(year);
  const easterBased = [
    toStr(addDays(e,-3)), // Jueves Santo
    toStr(addDays(e,-2)), // Viernes Santo
    toStr(nextMonday(addDays(e,39))), // Ascensión
    toStr(nextMonday(addDays(e,60))), // Corpus Christi
    toStr(nextMonday(addDays(e,68))), // Sagrado Corazón
  ];
  // Moveable to next monday: Reyes, San José, San Pedro, Asunción, Día Raza, Independencia Cartagena, Todos Santos, Independencia Iberoamérica
  const moveable = [
    [1,6],[3,19],[6,29],[8,15],[10,12],[11,1],[11,11],[1,1]
  ].map(([m,d]) => {
    const dt = new Date(year,m-1,d);
    return toStr(nextMonday(dt));
  });
  return new Set([...fixed,...easterBased,...moveable]);
}

function calcFechaFin(diasMax){
  const input = document.getElementById('crono-fecha-inicio');
  const output = document.getElementById('crono-fecha-fin');
  if(!input || !output || !input.value) return;
  const [y,m,d] = input.value.split('-').map(Number);
  let current = new Date(y,m-1,d);
  // Collect festivos for current year and next
  const festivos = new Set([...getFestivosColombia(y),...getFestivosColombia(y+1)]);
  let diasContados = 0;
  let iteraciones = 0;
  while(diasContados < diasMax && iteraciones < 500){
    iteraciones++;
    const dow = current.getDay();
    const str = current.toISOString().split('T')[0];
    if(dow !== 0 && dow !== 6 && !festivos.has(str)){
      diasContados++;
    }
    if(diasContados < diasMax) current.setDate(current.getDate()+1);
  }
  const opts = {weekday:'long',year:'numeric',month:'long',day:'numeric'};
  const fechaStr = current.toLocaleDateString('es-CO',opts);
  const diffMs = current - new Date(y,m-1,d);
  const diffDias = Math.round(diffMs/(1000*60*60*24))+1;
  output.innerHTML = `<span style="color:var(--color-text-success);font-weight:500">Finalización estimada: ${fechaStr}</span>
    <span style="color:var(--color-text-tertiary);font-size:11px;margin-left:8px">(${diffDias} días calendario)</span>`;
}

        <div style="margin-bottom:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--n500)">Personal Access Token</div>
        <input id="token-input" type="password" placeholder="patXXXXXXXXXXXXXX.XXXX..."
          style="width:100%;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 12px;font-size:13px;color:white;font-family:var(--mono);margin-bottom:8px;outline:none"
          onkeydown="if(event.key==='Enter') saveToken()">
        <div style="font-size:11px;color:var(--n500);margin-bottom:20px;line-height:1.5">
          Encuéntralo en Airtable → tu foto → Developer Hub → Personal access tokens
        </div>
        <button onclick="saveToken()" style="width:100%;background:var(--g600);color:white;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)">
          Acceder al panel
        </button>
        <div id="token-error" style="font-size:12px;color:#fca5a5;margin-top:10px;display:none;text-align:center">
          Token inválido — verifica que sea correcto
        </div>
      </div>
    </div>`;
}

async function saveToken(){
  const val = document.getElementById('token-input')?.value?.trim();
  if(!val || !val.startsWith('pat')){
    document.getElementById('token-error').style.display = 'block';
    return;
  }
  AT_TOKEN = val;
  // Test token
  try {
    const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TBL_PROYECTOS}?maxRecords=1`, {
      headers:{ Authorization:`Bearer ${AT_TOKEN}` }
    });
    if(!res.ok){ throw new Error('401'); }
    localStorage.setItem('grn_at_token', AT_TOKEN);
    document.querySelector('.content').innerHTML = `
      <div class="screen active" id="screen-list"><div class="list-wrap">
        <div class="list-hdr"><h1>Proyectos de modernización</h1></div>
        <div class="stats-row">
          <div class="stat"><div class="stat-val" id="stat-total">—</div><div class="stat-lbl">Proyectos</div></div>
          <div class="stat"><div class="stat-val" id="stat-pending">—</div><div class="stat-lbl">Decisiones pendientes</div></div>
          <div class="stat"><div class="stat-val" id="stat-hallazgos">—</div><div class="stat-lbl">Hallazgos críticos</div></div>
          <div class="stat"><div class="stat-val" id="stat-fotos">—</div><div class="stat-lbl">Fotos pendientes</div></div>
        </div>
        <div id="projects-container"><div class="loading"><div class="spinner"></div> Cargando proyectos...</div></div>
      </div></div>
      <div class="screen" id="screen-detail">
        <div class="detail-wrap">
          <div class="detail-topbar">
            <button class="btn-back" onclick="goBack()">← Volver</button>
            <div class="detail-title" id="detail-title">—</div>
            <div class="detail-code" id="detail-code">—</div>
          </div>
          <div class="detail-body">
            <div class="tabs-row">
              <button class="tab-btn active" onclick="switchTab('informe',this)">📋 Informe técnico</button>
              <button class="tab-btn" onclick="switchTab('decisiones',this)">⚖️ Decisiones comerciales</button>
              <button class="tab-btn" onclick="switchTab('cotizacion',this)">💰 Cotización</button>
              <button class="tab-btn" onclick="switchTab('cronograma',this)">📅 Cronograma</button>
            </div>
            <div class="tab-content">
              <div class="tab-pane active" id="tab-informe"><div class="loading"><div class="spinner"></div> Cargando...</div></div>
              <div class="tab-pane" id="tab-decisiones"><div class="loading"><div class="spinner"></div> Cargando...</div></div>
              <div class="tab-pane" id="tab-cotizacion"><div class="loading"><div class="spinner"></div> Cargando...</div></div>
              <div class="tab-pane" id="tab-cronograma"><div class="loading"><div class="spinner"></div> Cargando...</div></div>
            </div>
          </div>
        </div>
      </div>`;
    await loadAll();
    renderList();
  } catch(e){
    document.getElementById('token-error').style.display = 'block';
  }
}


// ─── START ────────────────────────────────────────────────────────────────────
if(AT_TOKEN){ init(); } else { showTokenScreen(); }
</script>
</body>
</html>
