
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greenergy — Panel de Modernizaciones</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --g900:#062812; --g800:#0a3d1c; --g700:#0f5526; --g600:#156b30;
  --g500:#1a853b; --g400:#22a44a; --g300:#3dc463; --g200:#7ddd99;
  --g100:#bff0ce; --g50:#e8faf0;
  --n900:#0d0f0e; --n800:#1a1e1c; --n700:#2b312d; --n600:#414a44;
  --n500:#5c6860; --n400:#7e8e84; --n300:#a8b5ae; --n200:#cdd8d2;
  --n100:#e4ece8; --n50:#f2f7f4;
  --amber:#f59e0b; --amberL:#fef3c7; --amberD:#92400e;
  --red:#ef4444; --redL:#fef2f2; --redD:#991b1b;
  --blue:#3b82f6; --blueL:#eff6ff; --blueD:#1e40af;
  --purple:#8b5cf6; --purpleL:#faf5ff; --purpleD:#6b21a8;
  --font:'DM Sans',sans-serif;
  --mono:'DM Mono',monospace;
  --r:8px; --r-lg:14px; --r-xl:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--n900);color:var(--n100);font-family:var(--font);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:var(--font);cursor:pointer;border:none}

/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{background:var(--n800);border-bottom:1px solid rgba(255,255,255,.07);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:32px;height:32px;background:var(--g500);border-radius:8px;display:flex;align-items:center;justify-content:center}
.brand-mark svg{width:18px;height:18px;fill:var(--g900)}
.brand-name{font-size:15px;font-weight:600;color:white;letter-spacing:-.02em}
.brand-sub{font-size:11px;color:var(--n400);margin-left:2px}
.topbar-right{display:flex;align-items:center;gap:10px}
.btn-refresh{background:rgba(255,255,255,.06);color:var(--n300);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:6px 12px;font-size:12px;font-weight:500;transition:all .2s}
.btn-refresh:hover{background:rgba(255,255,255,.1);color:white}
.content{flex:1;overflow:hidden;display:flex}

/* ── SCREENS ── */
.screen{display:none;width:100%;height:100%;overflow-y:auto}
.screen.active{display:block}

/* ── LIST SCREEN ── */
.list-wrap{max-width:1100px;margin:0 auto;padding:28px 24px}
.list-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.list-hdr h1{font-size:20px;font-weight:600;color:white;letter-spacing:-.02em}
.stats-row{display:flex;gap:12px;margin-bottom:24px}
.stat{background:var(--n800);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-lg);padding:14px 18px;flex:1}
.stat-val{font-size:24px;font-weight:600;color:white;line-height:1}
.stat-lbl{font-size:11px;color:var(--n400);margin-top:4px;font-weight:500}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.proj-card{background:var(--n800);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-lg);padding:18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.proj-card:hover{border-color:var(--g500);background:var(--n700);transform:translateY(-1px)}
.proj-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--g500);opacity:0;transition:opacity .2s}
.proj-card:hover::before{opacity:1}
.proj-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.proj-code{font-family:var(--mono);font-size:11px;color:var(--g300);font-weight:500;background:rgba(34,164,74,.12);padding:3px 8px;border-radius:4px}
.dec-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px}
.dec-badge.pendiente{background:rgba(245,158,11,.15);color:var(--amber)}
.dec-badge.en-proceso{background:rgba(59,130,246,.15);color:#93c5fd}
.dec-badge.completo{background:rgba(34,164,74,.15);color:var(--g300)}
.proj-name{font-size:15px;font-weight:600;color:white;margin-bottom:3px;letter-spacing:-.01em}
.proj-sub{font-size:12px;color:var(--n400);margin-bottom:12px}
.proj-meta{display:flex;gap:14px;margin-bottom:12px}
.proj-meta-item{font-size:11px;color:var(--n500);display:flex;align-items:center;gap:4px}
.proj-meta-item span{color:var(--n300)}
.prog-wrap{margin-bottom:6px}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--n500);margin-bottom:5px}
.prog-bar{height:4px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-fill{height:100%;background:var(--g500);border-radius:999px;transition:width .4s ease}
.hallazgos-row{display:flex;gap:6px;margin-top:10px}
.hallazgo-chip{font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;display:flex;align-items:center;gap:4px}
.h-malo{background:rgba(239,68,68,.15);color:#fca5a5}
.h-ausente{background:rgba(139,92,246,.15);color:#c4b5fd}
.h-fotos{background:rgba(245,158,11,.15);color:#fcd34d}

/* ── DETAIL SCREEN ── */
.detail-wrap{display:flex;flex-direction:column;height:100%}
.detail-topbar{background:var(--n800);border-bottom:1px solid rgba(255,255,255,.07);padding:0 24px;height:52px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.btn-back{background:rgba(255,255,255,.06);color:var(--n300);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:6px 12px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;transition:all .2s}
.btn-back:hover{background:rgba(255,255,255,.1);color:white}
.detail-title{font-size:14px;font-weight:600;color:white;flex:1}
.detail-code{font-family:var(--mono);font-size:11px;color:var(--g300);background:rgba(34,164,74,.12);padding:3px 8px;border-radius:4px}
.detail-body{flex:1;overflow:hidden;display:flex;flex-direction:column}
.tabs-row{background:var(--n800);border-bottom:1px solid rgba(255,255,255,.07);padding:0 24px;display:flex;gap:2px;flex-shrink:0}
.tab-btn{padding:12px 16px;font-size:13px;font-weight:500;color:var(--n400);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none}
.tab-btn.active{color:var(--g300);border-bottom-color:var(--g400)}
.tab-btn:hover:not(.active){color:var(--n200)}
.tab-content{flex:1;overflow-y:auto;padding:24px}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ── INFORME TAB ── */
.informe-wrap{max-width:900px;margin:0 auto}
.proj-info-card{background:var(--n800);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-lg);padding:20px;margin-bottom:20px}
.proj-info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.info-field{display:flex;flex-direction:column;gap:3px}
.info-field label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--n500)}
.info-field span{font-size:13px;color:var(--n100);font-weight:500}
.section-block{margin-bottom:20px}
.section-hdr{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.04);border-radius:var(--r);margin-bottom:8px;cursor:pointer;user-select:none}
.section-hdr:hover{background:rgba(255,255,255,.07)}
.section-icon{font-size:16px}
.section-name{font-size:13px;font-weight:600;color:white;flex:1}
.section-stats{display:flex;gap:8px}
.sec-stat{font-size:10px;padding:2px 8px;border-radius:999px}
.sec-stat.malo{background:rgba(239,68,68,.15);color:#fca5a5}
.sec-stat.ausente{background:rgba(139,92,246,.15);color:#c4b5fd}
.sec-stat.ok{background:rgba(34,164,74,.12);color:var(--g200)}
.section-chev{font-size:10px;color:var(--n500);transition:transform .2s}
.section-chev.open{transform:rotate(180deg)}
.items-list{display:flex;flex-direction:column;gap:6px}
.item-row{background:var(--n800);border:1px solid rgba(255,255,255,.06);border-radius:var(--r);overflow:hidden}
.item-row.crit{border-color:rgba(239,68,68,.3)}
.item-row.absent{border-color:rgba(139,92,246,.3)}
.item-hd{display:flex;align-items:center;padding:11px 14px;gap:10px;cursor:pointer}
.item-hd:hover{background:rgba(255,255,255,.03)}
.cond-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cond-dot.good{background:var(--g400)}
.cond-dot.regular{background:var(--amber)}
.cond-dot.bad{background:var(--red)}
.cond-dot.absent{background:var(--purple)}
.cond-dot.none{background:var(--n600)}
.item-name-wrap{flex:1;min-width:0}
.item-name{font-size:13px;font-weight:500;color:var(--n100)}
.item-ntc{font-size:10px;color:var(--n500);font-family:var(--mono)}
.item-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cond-pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px}
.cond-pill.good{background:rgba(34,164,74,.15);color:var(--g200)}
.cond-pill.regular{background:rgba(245,158,11,.15);color:#fcd34d}
.cond-pill.bad{background:rgba(239,68,68,.15);color:#fca5a5}
.cond-pill.absent{background:rgba(139,92,246,.15);color:#c4b5fd}
.cond-pill.none{background:rgba(255,255,255,.06);color:var(--n400)}
.ph-count{font-size:10px;color:var(--n500);font-family:var(--mono)}
.item-chev{font-size:10px;color:var(--n600);transition:transform .2s}
.item-chev.open{transform:rotate(180deg)}
.item-body{display:none;border-top:1px solid rgba(255,255,255,.05);padding:14px}
.item-body.open{display:block}
.fields-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.field-item{display:flex;flex-direction:column;gap:3px}
.field-item label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--n500)}
.field-item span{font-size:12px;color:var(--n200)}
.obs-block{grid-column:1/-1;background:rgba(255,255,255,.03);border-radius:var(--r);padding:10px;border-left:2px solid var(--n600)}
.obs-block label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--n500);display:block;margin-bottom:4px}
.obs-block p{font-size:12px;color:var(--n300);line-height:1.5}
.photos-section{margin-top:10px}
.photos-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--n500);margin-bottom:8px}
.photos-grid{display:flex;flex-wrap:wrap;gap:8px}
.photo-thumb{width:90px;height:70px;border-radius:var(--r);object-fit:cover;cursor:pointer;border:1px solid rgba(255,255,255,.08);transition:all .2s}
.photo-thumb:hover{transform:scale(1.05);border-color:var(--g400)}
.no-photos{font-size:11px;color:var(--n600);font-style:italic}

/* ── DECISIONES TAB ── */
.decisiones-wrap{max-width:900px;margin:0 auto}
.tierra-alert{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px}
.tierra-alert-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.tierra-alert-text h4{font-size:13px;font-weight:600;color:#fcd34d;margin-bottom:4px}
.tierra-alert-text p{font-size:12px;color:#fbbf24;line-height:1.5}
.pkg-decision{background:var(--n800);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden}
.pkg-dec-hdr{display:flex;align-items:center;padding:14px 18px;gap:12px;cursor:pointer;user-select:none}
.pkg-dec-hdr:hover{background:rgba(255,255,255,.03)}
.pkg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pkg-dec-title{font-size:14px;font-weight:600;color:white;flex:1}
.pkg-items-preview{font-size:11px;color:var(--n500)}
.pkg-dec-status{font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px}
.pkg-dec-status.sin{background:rgba(255,255,255,.06);color:var(--n400)}
.pkg-dec-status.nuevo{background:rgba(59,130,246,.15);color:#93c5fd}
.pkg-dec-status.segunda{background:rgba(245,158,11,.15);color:#fcd34d}
.pkg-dec-status.mant{background:rgba(34,164,74,.15);color:var(--g200)}
.pkg-dec-status.na{background:rgba(255,255,255,.06);color:var(--n500)}
.pkg-chev{font-size:10px;color:var(--n600);transition:transform .2s}
.pkg-chev.open{transform:rotate(180deg)}
.pkg-dec-body{display:none;border-top:1px solid rgba(255,255,255,.06);padding:16px 18px}
.pkg-dec-body.open{display:block}
.pkg-context{font-size:12px;color:var(--n400);margin-bottom:14px;line-height:1.5;padding:10px 12px;background:rgba(255,255,255,.03);border-radius:var(--r);border-left:2px solid var(--n600)}
.pkg-items-detail{margin-bottom:16px}
.pkg-items-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--n500);margin-bottom:8px}
.pkg-item-line{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.pkg-item-line:last-child{border-bottom:none}
.pkg-item-id{font-family:var(--mono);font-size:10px;color:var(--n500);width:50px;flex-shrink:0}
.pkg-item-name{font-size:12px;color:var(--n300);flex:1}
.pkg-item-cond{font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px}
.decision-form{border-top:1px solid rgba(255,255,255,.06);padding-top:14px}
.dec-form-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--n500);margin-bottom:10px}
.dec-options{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.dec-opt{padding:8px 14px;border-radius:var(--r);border:1.5px solid rgba(255,255,255,.1);background:transparent;color:var(--n400);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--font)}
.dec-opt:hover{border-color:rgba(255,255,255,.25);color:var(--n200)}
.dec-opt.selected.nuevo{border-color:#3b82f6;background:rgba(59,130,246,.15);color:#93c5fd}
.dec-opt.selected.segunda{border-color:var(--amber);background:rgba(245,158,11,.15);color:#fcd34d}
.dec-opt.selected.mant{border-color:var(--g400);background:rgba(34,164,74,.15);color:var(--g200)}
.dec-opt.selected.na{border-color:var(--n500);background:rgba(255,255,255,.06);color:var(--n300)}
.dec-obs textarea{width:100%;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--n100);font-family:var(--font);resize:vertical;min-height:70px;transition:border-color .2s}
.dec-obs textarea:focus{outline:none;border-color:var(--g400);background:rgba(255,255,255,.06)}
.dec-obs label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--n500);display:block;margin-bottom:6px}
.btn-save-pkg{background:var(--g600);color:white;border-radius:var(--r);padding:9px 18px;font-size:12px;font-weight:600;margin-top:12px;transition:all .2s}
.btn-save-pkg:hover{background:var(--g500)}
.btn-save-pkg:disabled{background:var(--n700);color:var(--n500);cursor:not-allowed}
.save-ok{font-size:11px;color:var(--g300);margin-left:10px;opacity:0;transition:opacity .3s}
.save-ok.show{opacity:1}
.traccion-note{background:rgba(34,164,74,.08);border:1px solid rgba(34,164,74,.2);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--g200);line-height:1.5}

/* ── LIGHTBOX ── */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:flex;align-items:center;justify-content:center;display:none}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:var(--r-lg);object-fit:contain}
.lightbox-close{position:absolute;top:20px;right:24px;background:rgba(255,255,255,.1);border:none;color:white;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ── LOADING / EMPTY ── */
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--n500);font-size:13px;gap:8px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--g400);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:48px 24px;color:var(--n500)}
.empty h3{font-size:16px;color:var(--n400);margin-bottom:6px}
.empty p{font-size:13px}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--n700);color:white;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;z-index:999;border:1px solid rgba(255,255,255,.1)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:600px){
  .proj-info-grid{grid-template-columns:1fr 1fr}
  .fields-grid{grid-template-columns:1fr}
  .stats-row{flex-wrap:wrap}
  .dec-options{gap:6px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M12 2L4 7v10l8 5 8-5V7L12 2zm0 2.3l6 3.7v8l-6 3.7L6 16V8l6-3.7z"/></svg>
      </div>
      <div>
        <div class="brand-name">Greenergy <span class="brand-sub">Ascensores</span></div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn-refresh" onclick="refreshData()">↻ Actualizar</button>
    </div>
  </div>
  <div class="content">
    <!-- LIST SCREEN -->
    <div class="screen active" id="screen-list">
      <div class="list-wrap">
        <div class="list-hdr">
          <h1>Proyectos de modernización</h1>
        </div>
        <div class="stats-row" id="stats-row">
          <div class="stat"><div class="stat-val" id="stat-total">—</div><div class="stat-lbl">Proyectos</div></div>
          <div class="stat"><div class="stat-val" id="stat-pending">—</div><div class="stat-lbl">Decisiones pendientes</div></div>
          <div class="stat"><div class="stat-val" id="stat-hallazgos">—</div><div class="stat-lbl">Hallazgos críticos</div></div>
          <div class="stat"><div class="stat-val" id="stat-fotos">—</div><div class="stat-lbl">Fotos pendientes</div></div>
        </div>
        <div id="projects-container">
          <div class="loading"><div class="spinner"></div> Cargando proyectos...</div>
        </div>
      </div>
    </div>

    <!-- DETAIL SCREEN -->
    <div class="screen" id="screen-detail">
      <div class="detail-wrap">
        <div class="detail-topbar">
          <button class="btn-back" onclick="goBack()">← Volver</button>
          <div class="detail-title" id="detail-title">—</div>
          <div class="detail-code" id="detail-code">—</div>
        </div>
        <div class="detail-body">
          <div class="tabs-row">
            <button class="tab-btn active" onclick="switchTab('informe',this)">📋 Informe técnico</button>
            <button class="tab-btn" onclick="switchTab('decisiones',this)">⚖️ Decisiones comerciales</button>
          </div>
          <div class="tab-content">
            <div class="tab-pane active" id="tab-informe">
              <div class="loading"><div class="spinner"></div> Cargando informe...</div>
            </div>
            <div class="tab-pane" id="tab-decisiones">
              <div class="loading"><div class="spinner"></div> Cargando decisiones...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
let AT_TOKEN = localStorage.getItem('grn_at_token') || '';
const BASE_ID  = 'app6WpUGWDLbyvI7k';
const TBL_PROYECTOS  = 'tblVly4txK2GjYBid';
const TBL_ITEMS      = 'tblbmQwbOLVtNqLFR';
const TBL_FOTOS      = 'tblZ2TgL2MrIspuNO';
const TBL_DECISIONES = 'tblRk1gJ5CadgsiOC';

const AT = (tbl, params='') =>
  fetch(`https://api.airtable.com/v0/${BASE_ID}/${tbl}${params}`, {
    headers:{ Authorization:`Bearer ${AT_TOKEN}` }
  }).then(r=>r.json());

const AT_POST = (tbl, body) =>
  fetch(`https://api.airtable.com/v0/${BASE_ID}/${tbl}`, {
    method:'POST',
    headers:{ Authorization:`Bearer ${AT_TOKEN}`, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  }).then(r=>r.json());

const AT_PATCH = (tbl, id, fields) =>
  fetch(`https://api.airtable.com/v0/${BASE_ID}/${tbl}/${id}`, {
    method:'PATCH',
    headers:{ Authorization:`Bearer ${AT_TOKEN}`, 'Content-Type':'application/json' },
    body: JSON.stringify({ fields })
  }).then(r=>r.json());

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  await loadAll();
  renderList();
}

async function loadAll(){
  try {
    const [pRes, iRes, fRes, dRes] = await Promise.all([
      fetchAll(TBL_PROYECTOS),
      fetchAll(TBL_ITEMS),
      fetchAll(TBL_FOTOS),
      fetchAll(TBL_DECISIONES),
    ]);
    allProyectos  = pRes;
    allItems      = iRes;
    allFotos      = fRes;
    allDecisiones = dRes;
  } catch(e){
    console.error(e);
    toast('Error al conectar con Airtable');
  }
}

async function fetchAll(tbl){
  let records = [], offset = null;
  do {
    const params = offset ? `?offset=${offset}` : '';
    const res = await AT(tbl, params);
    if(res.records) records = records.concat(res.records);
    offset = res.offset || null;
  } while(offset);
  return records;
}

async function refreshData(){
  toast('Actualizando datos...');
  await loadAll();
  if(curProyecto){
    renderDetail(curProyecto);
  } else {
    renderList();
  }
  toast('Datos actualizados ✓');
}

// ─── LIST ──────────────────────────────────────────────────────────────────────
function renderList(){
  const container = document.getElementById('projects-container');
  if(!allProyectos.length){
    container.innerHTML = `<div class="empty"><h3>Sin proyectos</h3><p>No se encontraron proyectos en Airtable.</p></div>`;
    return;
  }

  // Stats
  let totalHallazgos = 0, totalFotosPend = 0, totalPending = 0;
  allProyectos.forEach(p => {
    const pid = p.id;
    const items = allItems.filter(i => {
      const pLink = i.fields['Proyecto'];
      return Array.isArray(pLink) && pLink.includes(pid);
    });
    items.forEach(it => {
      const c = it.fields['Condición'];
      if(c === 'bad' || c === 'Malo') totalHallazgos++;
      if(c === 'absent' || c === 'Ausente') totalHallazgos++;
      const req = it.fields['N.° fotos requeridas'] || 0;
      const done = it.fields['N.° fotos cargadas'] || 0;
      totalFotosPend += Math.max(0, req - done);
    });
    const decs = allDecisiones.filter(d => {
      const pLink = d.fields['Proyecto'];
      return Array.isArray(pLink) && pLink.includes(pid);
    });
    if(!decs.length) totalPending++;
  });

  document.getElementById('stat-total').textContent = allProyectos.length;
  document.getElementById('stat-pending').textContent = totalPending;
  document.getElementById('stat-hallazgos').textContent = totalHallazgos;
  document.getElementById('stat-fotos').textContent = totalFotosPend;

  const sorted = [...allProyectos].sort((a,b) => {
    const fa = a.fields['Fecha visita'] || a.fields['Fecha'] || '';
    const fb = b.fields['Fecha visita'] || b.fields['Fecha'] || '';
    return fb.localeCompare(fa);
  });

  let html = '<div class="projects-grid">';
  sorted.forEach(p => { html += renderProjCard(p); });
  html += '</div>';
  container.innerHTML = html;
}

function renderProjCard(p){
  const f = p.fields;
  const pid = p.id;
  const items = allItems.filter(i => {
    const pLink = i.fields['Proyecto'];
    return Array.isArray(pLink) && pLink.includes(pid);
  });
  const total = items.length;
  const done  = items.filter(i => i.fields['Condición'] && i.fields['Condición'] !== '').length;
  const malo  = items.filter(i => i.fields['Condición'] === 'bad' || i.fields['Condición'] === 'Malo').length;
  const aus   = items.filter(i => i.fields['Condición'] === 'absent' || i.fields['Condición'] === 'Ausente').length;
  const fotosPend = items.reduce((s,i) => s + Math.max(0,(i.fields['N.° fotos requeridas']||0)-(i.fields['N.° fotos cargadas']||0)), 0);
  const pct = total ? Math.round(done/total*100) : 0;

  const decs = allDecisiones.filter(d => {
    const pLink = d.fields['Proyecto'];
    return Array.isArray(pLink) && pLink.includes(pid);
  });
  const decStatus = !decs.length ? 'pendiente' : decs.length < PAQUETES.length ? 'en-proceso' : 'completo';
  const decLabel  = decStatus === 'pendiente' ? 'Sin decisiones' : decStatus === 'en-proceso' ? 'En proceso' : 'Completo';

  const codigo  = f['Código proyecto'] || f['codigo'] || '—';
  const cliente = f['Cliente'] || '—';
  const torre   = f['Torre / Bloque'] || f['torre'] || '';
  const asc     = f['Ascensor'] || f['ascensor'] || '';
  const tecnico = f['Técnico'] || f['tecnico'] || '—';
  const fecha   = f['Fecha visita'] || f['fecha'] || '—';

  return `<div class="proj-card" onclick="openProject('${p.id}')">
    <div class="proj-card-top">
      <span class="proj-code">${codigo}</span>
      <span class="dec-badge ${decStatus}">${decLabel}</span>
    </div>
    <div class="proj-name">${cliente}</div>
    <div class="proj-sub">${[torre, asc].filter(Boolean).join(' · ')}</div>
    <div class="proj-meta">
      <div class="proj-meta-item">👤 <span>${tecnico}</span></div>
      <div class="proj-meta-item">📅 <span>${fecha}</span></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label"><span>Formulario completo</span><span>${pct}%</span></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="hallazgos-row">
      ${malo  ? `<span class="hallazgo-chip h-malo">● ${malo} malo${malo>1?'s':''}</span>` : ''}
      ${aus   ? `<span class="hallazgo-chip h-ausente">● ${aus} ausente${aus>1?'s':''}</span>` : ''}
      ${fotosPend ? `<span class="hallazgo-chip h-fotos">📷 ${fotosPend} foto${fotosPend>1?'s':''} pend.</span>` : ''}
    </div>
  </div>`;
}

// ─── DETAIL ───────────────────────────────────────────────────────────────────
function openProject(pid){
  curProyecto = allProyectos.find(p => p.id === pid);
  if(!curProyecto) return;
  document.getElementById('screen-list').classList.remove('active');
  document.getElementById('screen-detail').classList.add('active');
  renderDetail(curProyecto);
  switchTab('informe', document.querySelector('.tab-btn'));
}

function goBack(){
  curProyecto = null;
  document.getElementById('screen-detail').classList.remove('active');
  document.getElementById('screen-list').classList.add('active');
}

function switchTab(name, btn){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
}

function renderDetail(p){
  const f = p.fields;
  const cliente = f['Cliente'] || '—';
  const torre   = f['Torre / Bloque'] || f['torre'] || '';
  const asc     = f['Ascensor'] || f['ascensor'] || '';
  const codigo  = f['Código proyecto'] || f['codigo'] || '—';

  document.getElementById('detail-title').textContent = `${cliente}${torre?' — '+torre:''}${asc?' · '+asc:''}`;
  document.getElementById('detail-code').textContent  = codigo;

  renderInforme(p);
  renderDecisiones(p);
}

  const tecnico  = f['Técnico'] || f['tecnico'] || '—';

  const cap      = f['Capacidad (kg)'] || f['cap'] || '—';
  const vel      = f['Velocidad (m/s)'] || f['vel'] || '—';

    <div class="proj-info-card">

        <div class="info-field"><label>Cliente / Edificio</label><span>${cliente}</span></div>
        <div class="info-field"><label>Dirección</label><span>${dir}</span></div>
        <div class="info-field"><label>Torre / Bloque</label><span>${torre}</span></div>
        <div class="info-field"><label>Ascensor</label><span>${asc}</span></div>
        <div class="info-field"><label>Técnico</label><span>${tecnico}</span></div>
        <div class="info-field"><label>Fecha visita</label><span>${fecha}</span></div>
        <div class="info-field"><label>Marca original</label><span>${marca}</span></div>
        <div class="info-field"><label>Paradas</label><span>${paradas}</span></div>
        <div class="info-field"><label>Capacidad</label><span>${cap} kg</span></div>
        <div class="info-field"><label>Velocidad</label><span>${vel} m/s</span></div>
        <div class="info-field"><label>Tracción</label><span>${traccion}</span></div>
        <div class="info-field"><label>Tensión</label><span>${tension}</span></div>
        <div class="info-field"><label>Tipo puertas</label><span>${puertas}</span></div>
      </div>
    </div>`;

  SECCIONES.forEach(sec => {
    const secItems = items.filter(i => {
      const itemId = i.fields['ID ítem'] || '';
      const raw = itemId.includes('_') ? itemId.split('_')[1] : itemId;
      return raw.startsWith(sec.key);
    });
    if(!secItems.length) return;

    const malo = secItems.filter(i => i.fields['Condición'] === 'bad' || i.fields['Condición'] === 'Malo').length;
    const aus  = secItems.filter(i => i.fields['Condición'] === 'absent' || i.fields['Condición'] === 'Ausente').length;
    const ok   = secItems.filter(i => i.fields['Condición'] === 'good' || i.fields['Condición'] === 'Bueno').length;

    const secId = `sec-${sec.key}-${pid.slice(-4)}`;

        <span class="section-icon">${sec.icon}</span>

        <span class="section-chev open" id="chev-${secId}">▼</span>

      const iid   = it.id;
      const ifields = it.fields;
      const nombre = ifields['Nombre del ítem'] || '—';

      const cond   = normCond(ifields['Condición']);
      const condLabel = condText(cond);
      const campos = parseCampos(ifields['Campos técnicos']);
      const obs    = campos['_obs'] || '';
      const itemFotos = fotos.filter(ft => {
        const link = ft.fields['Ítem'];
        return Array.isArray(link) && link.includes(iid);
      });
      const fotosReq  = ifields['N.° fotos requeridas'] || 0;
      const fotosDone = ifields['N.° fotos cargadas'] || 0;

      const rowCls = cond === 'bad' ? 'item-row crit' : cond === 'absent' ? 'item-row absent' : 'item-row';
      const bodyId = `itbody-${iid}`;

      html += `<div class="${rowCls}">
        <div class="item-hd" onclick="togItem('${bodyId}')">

          <div class="item-name-wrap">

        </div>

        if(k === '_obs') return;
        html += `<div class="field-item"><label>${k}</label><span>${v || '—'}</span></div>`;

      if(obs){
        html += `<div class="obs-block"><label>Observaciones</label><p>${obs}</p></div>`;
      }

      html += `</div>`;

      if(itemFotos.length){
        html += `<div class="photos-section"><div class="photos-lbl">Fotos (${itemFotos.length})</div><div class="photos-grid">`;
        itemFotos.forEach(ft => {
          const arch = ft.fields['Archivo'];
          const label = ft.fields['Nombre requerido'] || '';
          if(arch && Array.isArray(arch) && arch[0]){
            html += `<img class="photo-thumb" src="${arch[0].url}" alt="${label}" title="${label}" onclick="openLightbox('${arch[0].url}')">`;
          }
        });
        html += `</div></div>`;
      } else {
        html += `<div class="photos-section"><div class="no-photos">Sin fotos cargadas</div></div>`;
      }

      html += `</div></div>`;
    });

    html += `</div></div>`;
  });

  html += '</div>';
  document.getElementById('tab-informe').innerHTML = html;
}

// ─── DECISIONES ───────────────────────────────────────────────────────────────
function renderDecisiones(p){
  const pid = p.id;
  const f   = p.fields;
  const traccion = (f['Tracción'] || f['traccion'] || '').toLowerCase();
  const is21 = traccion.includes('2:1');
  const items = allItems.filter(i => {
    const pLink = i.fields['Proyecto'];
    return Array.isArray(pLink) && pLink.includes(pid);
  });

  // Build decisionState from existing records
  decisionState = {};
  allDecisiones.filter(d => {
    const pLink = d.fields['Proyecto'];
    return Array.isArray(pLink) && pLink.includes(pid);
  }).forEach(d => {
    const pkg = d.fields['Paquete'] || '';
    decisionState[pkg] = {
      decision: d.fields['Decisión'] || '',
      obs: d.fields['Observaciones'] || '',
      airtableId: d.id
    };
  });

  // Check tierra
  const cm06 = items.find(i => {
    const iid = i.fields['ID ítem'] || '';
    const raw = iid.includes('_') ? iid.split('_')[1] : iid;
    return raw === 'cm06';
  });
  const campos06 = cm06 ? parseCampos(cm06.fields['Campos técnicos']) : {};
  const tierra = (campos06['Puesta a tierra'] || '').toLowerCase();
  const needsTierra = tierra === 'no' || tierra === 'parcial';

  let html = '<div class="decisiones-wrap">';

  if(needsTierra){
    html += `<div class="tierra-alert">
      <div class="tierra-alert-icon">⚠️</div>
      <div class="tierra-alert-text">
        <h4>Puesta a tierra deficiente — acción requerida del cliente</h4>
        <p>El informe registra puesta a tierra como <strong>${campos06['Puesta a tierra']}</strong>. El control NICE 3000 requiere resistencia de tierra ≤ 10 Ω. El cliente debe contratar un estudio y mejora de puesta a tierra antes del inicio de la modernización.</p>
      </div>
    </div>`;
  }

  PAQUETES.forEach(pkg => {
    const pkgItems = getPkgItems(pkg, is21, items);
    const dec = decisionState[pkg.key] || { decision:'', obs:'' };
    const statusCls = !dec.decision ? 'sin' : dec.decision === 'Nuevo' ? 'nuevo' : dec.decision === 'Segunda' ? 'segunda' : dec.decision === 'Mantenimiento' ? 'mant' : 'na';
    const statusLbl = !dec.decision ? 'Sin definir' : dec.decision;

    const critCount = pkgItems.filter(i => {
      const c = normCond(i.fields['Condición']);
      return c === 'bad' || c === 'absent';
    }).length;

    html += `<div class="pkg-decision">
      <div class="pkg-dec-hdr" onclick="togPkg('${pkg.key}')">
        <div class="pkg-dot" style="background:${pkg.color}"></div>
        <div class="pkg-dec-title">${pkg.label}</div>
        ${critCount ? `<span class="pkg-items-preview">⚠ ${critCount} crítico${critCount>1?'s':''}</span>` : ''}
        <span class="pkg-dec-status ${statusCls}">${statusLbl}</span>
        <span class="pkg-chev" id="pkgchev-${pkg.key}">▼</span>
      </div>
      <div class="pkg-dec-body" id="pkgbody-${pkg.key}">
        <div class="pkg-context">${pkg.desc}</div>`;

    // Tracción note for PKG1
    if(pkg.key === 'PKG1'){
      html += `<div class="traccion-note">
        Tracción detectada: <strong>${f['Tracción'] || f['traccion'] || 'No especificada'}</strong> —
        ${is21
          ? 'Terminales anclados en piso del cuarto de máquinas. Poleas de desvío en techo de cabina y contrapeso.'
          : 'Terminales en techo de cabina y contrapeso. Sin poleas de desvío en el recorrido.'}
      </div>`;
    }

    if(pkgItems.length){
      html += `<div class="pkg-items-detail"><div class="pkg-items-title">Ítems del formulario</div>`;
      pkgItems.forEach(it => {
        const nombre = it.fields['Nombre del ítem'] || '—';
        const iid = it.fields['ID ítem'] || '';
        const raw = iid.includes('_') ? iid.split('_')[1] : iid;
        const cond = normCond(it.fields['Condición']);
        html += `<div class="pkg-item-line">
          <span class="pkg-item-id">${raw}</span>
          <span class="pkg-item-name">${nombre}</span>
          <span class="pkg-item-cond cond-pill ${cond||'none'}">${condText(cond)}</span>
        </div>`;
      });
      html += `</div>`;
    }

    html += `<div class="decision-form">
      <div class="dec-form-title">Decisión comercial</div>
      <div class="dec-options">
        <button class="dec-opt nuevo ${dec.decision==='Nuevo'?'selected':''}" onclick="selectDec('${pkg.key}','Nuevo',this)">Nuevo</button>
        <button class="dec-opt segunda ${dec.decision==='Segunda'?'selected':''}" onclick="selectDec('${pkg.key}','Segunda',this)">Segunda</button>
        <button class="dec-opt mant ${dec.decision==='Mantenimiento'?'selected':''}" onclick="selectDec('${pkg.key}','Mantenimiento',this)">Mantenimiento</button>
        <button class="dec-opt na ${dec.decision==='No aplica'?'selected':''}" onclick="selectDec('${pkg.key}','No aplica',this)">No aplica</button>
      </div>
      <div class="dec-obs">
        <label>Observaciones</label>
        <textarea id="obs-${pkg.key}" placeholder="Notas adicionales para este paquete...">${dec.obs}</textarea>
      </div>
      <div style="display:flex;align-items:center">
        <button class="btn-save-pkg" onclick="saveDec('${pkg.key}','${pid}')">Guardar decisión</button>
        <span class="save-ok" id="saveok-${pkg.key}">✓ Guardado</span>
      </div>
    </div>
    </div></div>`;
  });

  html += '</div>';
  document.getElementById('tab-decisiones').innerHTML = html;
}

function getPkgItems(pkg, is21, items){
  let ids = [];
  if(pkg.key === 'PKG1'){
    ids = is21 ? (pkg.items['2:1'] || []) : (pkg.items['1:1'] || []);
  } else {
    ids = Array.isArray(pkg.items) ? pkg.items : [];
  }
  return items.filter(i => {
    const iid = i.fields['ID ítem'] || '';
    const raw = iid.includes('_') ? iid.split('_')[1] : iid;
    return ids.includes(raw);
  });
}

function selectDec(pkgKey, value, btn){
  // Update UI
  const opts = btn.closest('.dec-options').querySelectorAll('.dec-opt');
  opts.forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  // Update state
  if(!decisionState[pkgKey]) decisionState[pkgKey] = { decision:'', obs:'', airtableId:null };
  decisionState[pkgKey].decision = value;
}

async function saveDec(pkgKey, pid){
  const decision = decisionState[pkgKey]?.decision || '';
  const obs = document.getElementById(`obs-${pkgKey}`)?.value || '';
  const existing = decisionState[pkgKey]?.airtableId;

  const fields = {
    'ID decisión': `${pid.slice(-6)}_${pkgKey}`,
    'Paquete': pkgKey,
    'Decisión': decision,
    'Observaciones': obs,
    'Proyecto': [pid],
    'Fecha decisión': new Date().toISOString().split('T')[0],
  };

  try {
    if(existing){
      await AT_PATCH(TBL_DECISIONES, existing, fields);
    } else {
      const res = await AT_POST(TBL_DECISIONES, { fields });
      if(res.id){
        if(!decisionState[pkgKey]) decisionState[pkgKey] = {};
        decisionState[pkgKey].airtableId = res.id;
        allDecisiones.push(res);
      }
    }
    decisionState[pkgKey].obs = obs;
    const ok = document.getElementById(`saveok-${pkgKey}`);
    if(ok){ ok.classList.add('show'); setTimeout(()=>ok.classList.remove('show'),2000); }
    toast('Decisión guardada ✓');
  } catch(e){
    console.error(e);
    toast('Error al guardar — intenta de nuevo');
  }
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function normCond(c){
  if(!c) return '';
  const map = { 'Bueno':'good','Buena':'good','good':'good', 'Regular':'regular','regular':'regular', 'Malo':'bad','bad':'bad', 'Ausente':'absent','absent':'absent' };
  return map[c] || '';
}
function condText(c){
  const map = { good:'Bueno', regular:'Regular', bad:'Malo', absent:'Ausente', '':'Sin datos' };
  return map[c] || 'Sin datos';
}
function parseCampos(raw){
  if(!raw) return {};
  try { return JSON.parse(raw); } catch(e){ return {}; }
}
function togSection(id){
  const el = document.getElementById(id);
  const chev = document.getElementById('chev-'+id);
  if(!el) return;
  const open = el.style.display !== 'none' && el.style.display !== '';
  el.style.display = open ? 'none' : 'flex';
  if(chev) chev.classList.toggle('open', !open);
}
function togItem(id){
  const el = document.getElementById(id);
  const chev = document.getElementById('chev-'+id);
  if(!el) return;
  const isOpen = el.classList.contains('open');
  el.classList.toggle('open', !isOpen);
  if(chev) chev.classList.toggle('open', !isOpen);
}
function togPkg(key){
  const el = document.getElementById(`pkgbody-${key}`);
  const chev = document.getElementById(`pkgchev-${key}`);
  if(!el) return;
  const isOpen = el.classList.contains('open');
  el.classList.toggle('open', !isOpen);
  if(chev) chev.classList.toggle('open', !isOpen);
}
function openLightbox(url){
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 2400);
}

async function saveToken(){
  const val = document.getElementById('token-input')?.value?.trim();
  if(!val || !val.startsWith('pat')){
    document.getElementById('token-error').style.display = 'block';
    return;
  }
  AT_TOKEN = val;
  // Test token
  try {
    const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TBL_PROYECTOS}?maxRecords=1`, {
      headers:{ Authorization:`Bearer ${AT_TOKEN}` }
    });
    if(!res.ok){ throw new Error('401'); }
    localStorage.setItem('grn_at_token', AT_TOKEN);
